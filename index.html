  var CHAR_EMOJI = { diva: "👑", prowler: "🐆", expert: "🧠", analyst: "🔍" };

  function byId(id) {
    for (var i = 0; i < CATALOG.length; i++) if (CATALOG[i].id === id) return CATALOG[i];
    return null;
  }

  function fmtMoney(n) {
    n = Math.round(n) || 0;
    var neg = n < 0; n = Math.abs(n);
    var s = String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    return (neg ? "-" : "") + "$" + s;
  }

  function getCharacter() {
    return (MA.characters && MA.characters.getCharacter) ? MA.characters.getCharacter() : null;
  }
  function finalPrice(usd) {
    return Math.round(usd * (getCharacter() === "diva" ? 0.85 : 1));
  }

  /* ---------- owned set (in-memory, hydrated from the "owned" store) ---------- */
  // ownedSet[id] is truthy the instant a purchase is CLAIMED (see buy()), not only
  // once it's persisted — this is what makes the double-buy guard synchronous.
  var ownedSet = {};
  var ready = MA.store.all("owned").then(function (list) {
    list.forEach(function (r) { ownedSet[r.id] = r; });
  }).catch(function () { ownedSet = {}; });

  function isOwned(id) { return !!ownedSet[id]; }

  /* ---------- purchase (buy-exactly-once guard) ----------
     See _shared-context.md cross-task notes / MA.characters.select for why this
     shape: the "already claimed?" check-and-set on the in-memory ownedSet happens
     synchronously, with no await/.then between the read and the write, so two
     overlapping buy() calls for the same id (double-click, or two controls firing
     before the first settles) cannot both pass the check and both spend(). The
     claim is rolled back ONLY when no charge actually landed (insufficient funds,
     or spend() itself failed) — never after a real spend, which would authorize a
     double payout on retry. */
  function buy(id) {
    return ready.then(function () {
      if (ownedSet[id]) return { ok: false, reason: "owned" };
      var item = byId(id);
      if (!item) return { ok: false, reason: "missing" };
      // synchronous claim — first statement after the read above, no await/.then in between.
      ownedSet[id] = { id: id, _pending: true };
      var credited = false;
      var price = finalPrice(item.usd);
      return MA.economy.ready.then(function () {
        var wallet = MA.economy.getWallet();
        if (wallet < price) {
          delete ownedSet[id]; // no charge occurred -> release the claim
          return { ok: false, reason: "funds", shortfall: price - wallet };
        }
        return MA.economy.spend(price).then(function (success) {
          if (!success) {
            delete ownedSet[id];
            return { ok: false, reason: "funds", shortfall: price - MA.economy.getWallet() };
          }
          credited = true;
          var rec = { id: id, at: Date.now(), price: price, usd: item.usd };
          ownedSet[id] = rec;
          return MA.store.put("owned", rec).then(function () {
            return { ok: true, price: price, record: rec };
          }).catch(function () {
            // charge already happened — keep the in-memory claim regardless of the
            // persistence outcome; rolling back here would let a retry double-spend.
            return { ok: true, price: price, record: rec, persistWarning: true };
          });
        });
      }).catch(function (err) {
        if (!credited) delete ownedSet[id];
        throw err;
      });
    });
  }

  /* ---------- confirm dialog ---------- */
  var confirmOpen = false;
  function openConfirm(item, onCancelOrClose) {
    if (confirmOpen) { if (onCancelOrClose) onCancelOrClose(); return; }
    confirmOpen = true;
    var lastFocused = document.activeElement;
    var titleId = "shopConfirmTitle" + Date.now();
    var price = finalPrice(item.usd);
    var diva = getCharacter() === "diva" && price !== item.usd;

    var overlay = el("div", { class: "shop-confirm-modal", role: "dialog", "aria-modal": "true", "aria-labelledby": titleId });
    var card = el("div", { class: "shop-confirm-modal__card" });
    overlay.appendChild(card);

    function focusables() {
      return Array.prototype.slice.call(overlay.querySelectorAll("button, [href], input, select, textarea, [tabindex]:not([tabindex='-1'])"))
        .filter(function (n) { return !n.disabled && n.offsetParent !== null; });
    }
    function close(purchased) {
      if (!overlay.parentNode) return;
      document.removeEventListener("keydown", onKeydown);
      overlay.parentNode.removeChild(overlay);
      confirmOpen = false;
      if (!purchased && onCancelOrClose) onCancelOrClose();
      if (lastFocused && lastFocused.focus) { try { lastFocused.focus(); } catch (e) {} }
    }
    function onKeydown(e) {
      if (e.key === "Escape") { close(false); return; }
      if (e.key === "Tab") {
        var f = focusables();
        if (!f.length) return;
        var first = f[0], last = f[f.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    }
    overlay.addEventListener("click", function (e) { if (e.target === overlay) close(false); });

    card.appendChild(el("div", { class: "shop-confirm-modal__emoji", "aria-hidden": "true", text: item.emoji }));
    card.appendChild(el("h3", { id: titleId, class: "shop-confirm-modal__title", text: "Buy " + item.name + "?" }));
    if (diva) {
      card.appendChild(el("div", { class: "shop-confirm-modal__list-price", text: fmtMoney(item.usd) }));
      card.appendChild(el("div", { class: "shop-confirm-modal__price shop-confirm-modal__price--diva", text: fmtMoney(price) + " · 15% off (👑 Diva)" }));
    } else {
      card.appendChild(el("div", { class: "shop-confirm-modal__price", text: fmtMoney(price) }));
    }

    var errEl = el("div", { class: "shop-confirm-modal__err", "aria-live": "polite" });

    var confirmBtn = el("button", { class: "btn btn--primary", type: "button", "aria-label": "Confirm purchase of " + item.name + " for " + fmtMoney(price) }, "Confirm — " + fmtMoney(price));
    var cancelBtn = el("button", { class: "btn btn--ghost", type: "button", "aria-label": "Cancel purchase" }, "Cancel");
    cancelBtn.addEventListener("click", function () { close(false); });
    confirmBtn.addEventListener("click", function () {
      if (confirmBtn.disabled) return;
      // defense-in-depth: disable synchronously on click; the real guard is buy()'s
      // synchronous in-memory claim (see comment on buy()).
      confirmBtn.disabled = true; cancelBtn.disabled = true;
      buy(item.id).then(function (result) {
        if (result.ok) {
          close(true);
          if (MA.app && MA.app.closeSheet) MA.app.closeSheet();
          if (activeRefresh) activeRefresh();
          if (MA.celebrate) MA.celebrate({ count: 130, y: (window.innerHeight || 800) * 0.4 });
          if (MA.app && MA.app.toast) MA.app.toast(item.name + " purchased!");
        } else if (result.reason === "funds") {
          confirmBtn.disabled = false; cancelBtn.disabled = false;
          var msg = "You need " + fmtMoney(result.shortfall) + " more";
          errEl.textContent = msg;
          if (MA.app && MA.app.toast) MA.app.toast(msg);
        } else if (result.reason === "owned") {
          close(true);
          if (activeRefresh) activeRefresh();
          if (MA.app && MA.app.toast) MA.app.toast("You already own this");
        } else {
          confirmBtn.disabled = false; cancelBtn.disabled = false;
          if (MA.app && MA.app.toast) MA.app.toast("Couldn't complete purchase — try again");
        }
      }).catch(function () {
        confirmBtn.disabled = false; cancelBtn.disabled = false;
        if (MA.app && MA.app.toast) MA.app.toast("Couldn't complete purchase — try again");
      });
    });
    card.appendChild(errEl);
    card.appendChild(confirmBtn);
    card.appendChild(cancelBtn);

    document.addEventListener("keydown", onKeydown);
    document.body.appendChild(overlay);
    setTimeout(function () { var f = focusables(); if (f.length) f[0].focus(); }, 30);
  }

  /* ---------- detail sheet ---------- */
  function openDetail(id) {
    var item = byId(id);
    if (!item) return;
    var wrap = el("div", { class: "stack shop-detail" });
    if (item.gallery && item.gallery.length) {
      wrap.appendChild(renderGallery(item));
    } else {
      wrap.appendChild(el("div", { class: "shop-detail__art " + TIER_ART_CLASS[item.tier], "aria-hidden": "true", text: item.emoji }));
    }
    wrap.appendChild(el("h3", { text: item.name }));
    wrap.appendChild(el("p", { class: "muted", text: item.blurb }));
    wrap.appendChild(el("div", { class: "shop-detail__price", text: fmtMoney(item.usd) }));

    if (isOwned(id)) {
      wrap.appendChild(el("span", { class: "pill pill--accent", text: "Owned ✓" }));
    } else {
      var buyBtn = el("button", { class: "btn btn--primary btn--block", type: "button", "aria-label": "Buy " + item.name + " for " + fmtMoney(item.usd) }, "Buy — " + fmtMoney(item.usd));

        if (buyBtn.disabled) return;
        buyBtn.disabled = true;
        openConfirm(item, function () { buyBtn.disabled = false; });

  /* ---------- card + grid ---------- */
  function renderCard(item) {
    var owned = isOwned(item.id);
    var art = el("div", { class: "shop-card__art " + TIER_ART_CLASS[item.tier], "aria-hidden": "true", text: item.emoji });
    var body = el("div", { class: "shop-card__body" }, [

    ]);
    var actionWrap = el("div", { class: "shop-card__action" });
    if (owned) {
      actionWrap.appendChild(el("span", { class: "pill pill--accent", text: "Owned ✓" }));
    } else {
      var buyBtn = el("button", { class: "btn btn--primary btn--sm btn--block", type: "button", "aria-label": "Buy " + item.name + " for " + fmtMoney(item.usd) }, "Buy");
      buyBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        if (buyBtn.disabled) return;
        buyBtn.disabled = true;
        openConfirm(item, function () { buyBtn.disabled = false; });
      });
      actionWrap.appendChild(buyBtn);
    }
    var card = el("button", { type: "button", class: "shop-card", "aria-label": "View details for " + item.name }, [art, body, actionWrap]);
    card.addEventListener("click", function (e) {
      if (e.target.closest && e.target.closest(".shop-card__action")) return;
      openDetail(item.id);
    });
    return card;
  }

  function render() {

    updateCharBadge();

    var chipsWrap = el("div", { class: "shop-chips", role: "group", "aria-label": "Shop categories" });
    var chipBtns = CHIPS.map(function (c) {
      var btn = el("button", { class: "shop-chip", type: "button", "aria-label": c.label, "aria-pressed": (currentFilter === c.key) ? "true" : "false" }, c.label);
      btn.addEventListener("click", function () {
        currentFilter = c.key;
        chipBtns.forEach(function (b, i) { b.setAttribute("aria-pressed", CHIPS[i].key === currentFilter ? "true" : "false"); });
        refresh();
      });
      chipsWrap.appendChild(btn);
      return btn;
    });
    wrap.appendChild(chipsWrap);

    var gridWrap = el("div", { class: "shop-grid" });
    wrap.appendChild(gridWrap);

    function refresh() {
      walletAmt.textContent = fmtMoney(MA.economy.getWallet());
      var items = CATALOG.filter(function (it) {
        if (currentFilter === "all") return true;
        if (currentFilter === "owned") return isOwned(it.id);
        return it.tier === currentFilter;
      });
      gridWrap.innerHTML = "";
      if (!items.length) {
        gridWrap.appendChild(el("div", { class: "empty" }, [
          el("div", { class: "empty__emoji", text: "🛍️" }),
          el("h3", { text: "Nothing here yet" }),
          el("p", { class: "muted", text: currentFilter === "owned" ? "Items you buy will show up here." : "No items in this category." })
        ]));
        return;
      }
      items.forEach(function (it) { gridWrap.appendChild(renderCard(it)); });
    }

    ready.then(refresh);

    function onCoins() { walletAmt.textContent = fmtMoney(MA.economy.getWallet()); }
    function onChar() { updateCharBadge(); }
    window.addEventListener("ma:coins", onCoins);
    window.addEventListener("ma:character", onChar);
    activeRefresh = refresh;
    if (MA.app && MA.app.onLeave) MA.app.onLeave(function () {
      window.removeEventListener("ma:coins", onCoins);
      window.removeEventListener("ma:character", onChar);
      if (activeRefresh === refresh) activeRefresh = null;
    });

    return wrap;
  }

  MA.shop = { catalog: CATALOG, render: render, isOwned: isOwned, openDetail: openDetail, ready: ready };
})();

</script>
<script>
/* ---- js/modules/flashcards.js ---- */
/* flashcards.js — Quizlet-style decks with four study modes:
   Flashcards (flip), Learn (Leitner spaced repetition), Match, and Test. */
(function () {
  "use strict";
  var MA = window.MA, U = MA.util, el = U.el;

  function decks() { return (window.MA_DATA && MA_DATA.decks) || []; }
  function deckById(id) { return decks().filter(function (d) { return d.id === id; })[0]; }

  /* ---- SRS state (Leitner). Stored in kv as srs:<deckId> = { cardId: {box, due} } ---- */
  function srsKey(id) { return "srs:" + id; }
  function loadSrs(id) { return MA.store.getKV(srsKey(id), {}); }
  function saveSrs(id, map) { return MA.store.setKV(srsKey(id), map); }
  var BOX_DAYS = [0, 1, 2, 4, 7, 15]; // box 1..5 review intervals
  function isDue(rec) { return !rec || !rec.due || rec.due <= Date.now(); }

  /* ============ deck list ============ */
  function renderList() {
    var wrap = el("div", { class: "stack" });
    wrap.appendChild(el("p", { class: "muted", text: "Pick a deck, then choose a study mode. Your progress saves on this device." }));

    var subjects = {};
    decks().forEach(function (d) { (subjects[d.subject] = subjects[d.subject] || []).push(d); });

    Object.keys(subjects).forEach(function (subj) {
      wrap.appendChild(el("div", { class: "section-title", text: subj }));
      var list = el("div", { class: "list" });
      subjects[subj].forEach(function (d) {
        list.appendChild(el("button", {
          class: "list__item", onclick: function () { MA.app.go("study/" + d.id); }
        }, [
          el("span", { class: "tile__emoji", text: d.emoji || "🃏" }),
          el("div", { class: "list__grow" }, [
            el("div", { class: "list__title", text: d.title }),
            el("div", { class: "list__sub", text: d.cards.length + " cards" })
          ]),
          el("span", { class: "chev", text: "›" })
        ]));
      });
      wrap.appendChild(list);
    });
    return wrap;
  }

  /* ============ deck home (mode picker) ============ */
  function renderDeck(deckId) {
    var d = deckById(deckId);
    if (!d) return el("div", { class: "empty" }, "Deck not found.");
    var wrap = el("div", { class: "stack" });
    wrap.appendChild(el("div", { class: "hero" }, [
      el("div", { class: "pill", text: d.subject }),
      el("h2", { text: d.title }),
      el("div", { class: "muted", text: d.cards.length + " cards" })
    ]));

    var dueNote = el("div", { class: "muted center", text: "" });
    loadSrs(deckId).then(function (map) {
      var due = d.cards.filter(function (c) { return isDue(map[c.id]); }).length;
      var learned = d.cards.length - due;
      dueNote.textContent = learned + " learned · " + due + " due for review";
    });

    var modes = [
      { k: "cards", emoji: "🃏", name: "Flashcards", sub: "Flip through at your pace" },
      { k: "learn", emoji: "🧠", name: "Learn", sub: "Spaced repetition (recommended)" },
      { k: "match", emoji: "🧩", name: "Match", sub: "Pair terms & definitions, timed" },
      { k: "test", emoji: "📝", name: "Test", sub: "Multiple-choice self-quiz" }
    ];
    if (MA.diagrams && MA.diagrams.deckHasDiagrams(deckId)) {
      modes.push({ k: "diagrams", emoji: "🖼️", name: "Diagrams", sub: "Servier medical illustrations" });
    }
    var grid = el("div", { class: "tiles" });
    modes.forEach(function (m) {
      grid.appendChild(el("button", { class: "tile", onclick: function () { MA.app.go("study/" + deckId + "/" + m.k); } }, [
        el("span", { class: "tile__emoji", text: m.emoji }),
        el("span", { class: "tile__name", text: m.name }),
        el("span", { class: "tile__sub", text: m.sub })
      ]));
    });
    wrap.appendChild(dueNote);
    wrap.appendChild(grid);
    return wrap;
  }

  /* ============ mode: flashcards (flip) ============ */
  function renderCards(deckId) {
    var d = deckById(deckId);
    var cards = U.shuffle(d.cards);
    var i = 0;
    var wrap = el("div", { class: "stack" });
    var counter = el("div", { class: "muted center", text: "" });
    var stage = el("div", { class: "flash-stage" });
    var flash = el("div", { class: "flash", role: "button", tabindex: "0", "aria-label": "Tap to flip card" });
    var front = el("div", { class: "flash__face" }, [el("div", { class: "flash__term" })]);
    var back = el("div", { class: "flash__face flash__face--back" }, [el("div", { class: "flash__def" })]);
    flash.appendChild(front); flash.appendChild(back);
    flash.appendChild(el("div", { class: "flash__hint", text: "Tap to flip" }));
    stage.appendChild(flash);

    function show() {
      var c = cards[i];
      front.querySelector(".flash__term").textContent = c.term;
      back.querySelector(".flash__def").textContent = c.def + (c.hint ? "  💡 " + c.hint : "");
      flash.classList.remove("is-flipped");
      counter.textContent = (i + 1) + " / " + cards.length;
    }
    function flip() { flash.classList.toggle("is-flipped"); }
    function next(step) { i = (i + step + cards.length) % cards.length; show(); }
    flash.addEventListener("click", flip);
    flash.addEventListener("keydown", function (e) { if (e.key === " " || e.key === "Enter") { e.preventDefault(); flip(); } });

    var nav = el("div", { class: "row row--between" }, [
      el("button", { class: "btn btn--ghost", onclick: function () { next(-1); }, "aria-label": "Previous" }, "‹ Prev"),
      el("button", { class: "btn btn--ghost", onclick: function () { next(1); }, "aria-label": "Next" }, "Next ›")
    ]);
    wrap.appendChild(counter); wrap.appendChild(stage); wrap.appendChild(nav);
    show();
    return wrap;
  }

  /* ============ mode: learn (Leitner SRS) ============ */
  function renderLearn(deckId) {
    var d = deckById(deckId);
    var wrap = el("div", { class: "stack" });
    var body = el("div");
    wrap.appendChild(body);
    loadSrs(deckId).then(function (map) {
      var queue = U.shuffle(d.cards.filter(function (c) { return isDue(map[c.id]); }));
      if (!queue.length) queue = U.shuffle(d.cards); // nothing due → review all
      var idx = 0, correct = 0;
      step();

      function grade(card, knew) {
        var rec = map[card.id] || { box: 1 };
        rec.box = knew ? Math.min(5, (rec.box || 1) + 1) : 1;
        rec.due = Date.now() + BOX_DAYS[rec.box] * 86400000;
        map[card.id] = rec;
        if (knew) correct++;
        saveSrs(deckId, map);
        idx++; step();
      }
      function step() {
        body.innerHTML = "";
        if (idx >= queue.length) { body.appendChild(done()); return; }
        var c = queue[idx];
        body.appendChild(el("div", { class: "muted center", text: (idx + 1) + " / " + queue.length }));
        var stage = el("div", { class: "flash-stage" });
        var flash = el("div", { class: "flash", role: "button", tabindex: "0", "aria-label": "Tap to reveal answer" });
        flash.appendChild(el("div", { class: "flash__face" }, [el("div", { class: "flash__term", text: c.term })]));
        flash.appendChild(el("div", { class: "flash__face flash__face--back" }, [el("div", { class: "flash__def", text: c.def })]));
        flash.appendChild(el("div", { class: "flash__hint", text: "Tap to reveal" }));
        stage.appendChild(flash);
        var revealed = false;
        var actions = el("div", { class: "stack" });
        function reveal() { if (revealed) return; revealed = true; flash.classList.add("is-flipped"); actions.appendChild(graders); }
        flash.addEventListener("click", reveal);
        flash.addEventListener("keydown", function (e) { if (e.key === " " || e.key === "Enter") { e.preventDefault(); reveal(); } });
        var graders = el("div", { class: "row", style: "gap:10px" }, [
          el("button", { class: "btn btn--danger btn--block", onclick: function () { grade(c, false); } }, "Still learning"),
          el("button", { class: "btn btn--accent btn--block", onclick: function () { grade(c, true); } }, "Got it ✓")
        ]);
        body.appendChild(stage); body.appendChild(actions);
      }
      function done() {
        MA.app.bumpStreak();
        return el("div", { class: "empty" }, [
          el("div", { class: "empty__emoji", text: "🎉" }),
          el("h3", { text: "Session complete" }),
          el("p", { class: "muted", text: "You knew " + correct + " of " + queue.length + ". Spaced repetition scheduled the rest for review." }),
          el("button", { class: "btn btn--primary", onclick: function () { MA.app.go("study/" + deckId); } }, "Back to deck")
        ]);
      }
    });
    return wrap;
  }

  /* ============ mode: match (timed pairing) ============ */
  function renderMatch(deckId) {
    var d = deckById(deckId);
    var pick = U.shuffle(d.cards).slice(0, 6);
    var tiles = [];
    pick.forEach(function (c) {
      tiles.push({ id: c.id, kind: "term", text: c.term });
      tiles.push({ id: c.id, kind: "def", text: c.def });
    });
    tiles = U.shuffle(tiles);
    var wrap = el("div", { class: "stack" });
    var t0 = Date.now(), matched = 0, sel = null, timerNode = el("div", { class: "muted center", text: "0.0s" });
    var timer = setInterval(function () { timerNode.textContent = ((Date.now() - t0) / 1000).toFixed(1) + "s"; }, 100);
    MA.app.onLeave(function () { clearInterval(timer); });

    var grid = el("div", { class: "match-grid" });
    tiles.forEach(function (t) {
      var cell = el("button", { class: "match-cell", text: t.text });
      cell._t = t;
      cell.addEventListener("click", function () {
        if (cell.classList.contains("ok")) return;
        if (!sel) { sel = cell; cell.classList.add("sel"); return; }
        if (sel === cell) { sel.classList.remove("sel"); sel = null; return; }
        if (sel._t.id === t.id && sel._t.kind !== t.kind) {
          sel.classList.add("ok"); cell.classList.add("ok"); sel.classList.remove("sel"); sel = null; matched++;
          if (matched === pick.length) {
            clearInterval(timer);
            grid.after(el("div", { class: "empty" }, [
              el("div", { class: "empty__emoji", text: "⚡" }),
              el("h3", { text: "Matched in " + ((Date.now() - t0) / 1000).toFixed(1) + "s" }),
              el("button", { class: "btn btn--primary", onclick: function () { MA.app.go("study/" + deckId + "/match"); } }, "Play again")
            ]));
          }
        } else {
          var a = sel, b = cell; a.classList.add("bad"); b.classList.add("bad");
          setTimeout(function () { a.classList.remove("bad", "sel"); b.classList.remove("bad"); }, 350); sel = null;
        }
      });
      grid.appendChild(cell);
    });
    wrap.appendChild(el("p", { class: "muted center", text: "Tap a term, then its matching definition." }));
    wrap.appendChild(timerNode); wrap.appendChild(grid);
    return wrap;
  }

  /* ============ mode: test (MC self-quiz built from cards) ============ */
  function renderTest(deckId) {
    var d = deckById(deckId);
    var qs = U.shuffle(d.cards).slice(0, Math.min(10, d.cards.length));
    var wrap = el("div", { class: "stack" });
    var body = el("div"); wrap.appendChild(body);
    var idx = 0, score = 0;
    step();
    function step() {
      body.innerHTML = "";
      if (idx >= qs.length) { body.appendChild(MA.quiz.scoreCard(score, qs.length, function () { MA.app.go("study/" + deckId); })); return; }
      var c = qs[idx];
      var distract = U.shuffle(d.cards.filter(function (x) { return x.id !== c.id; })).slice(0, 3).map(function (x) { return x.def; });
      var options = U.shuffle([c.def].concat(distract));
      body.appendChild(el("div", { class: "muted center", text: (idx + 1) + " / " + qs.length }));
      body.appendChild(el("div", { class: "card" }, [el("h3", { text: c.term })]));
      var answered = false;
      options.forEach(function (opt) {
        var b = el("button", { class: "opt", text: opt });
        b.addEventListener("click", function () {
          if (answered) return; answered = true;
          var ok = opt === c.def;
          if (ok) { b.classList.add("correct"); score++; }
          else { b.classList.add("wrong"); Array.prototype.forEach.call(body.querySelectorAll(".opt"), function (o) { if (o.textContent === c.def) o.classList.add("correct"); }); }
          Array.prototype.forEach.call(body.querySelectorAll(".opt"), function (o) { o.disabled = true; });
          body.appendChild(el("button", { class: "btn btn--primary btn--block", style: "margin-top:14px", onclick: function () { idx++; step(); } }, idx + 1 >= qs.length ? "See score" : "Next"));
        });
        body.appendChild(b);
      });
    }
    return wrap;
  }

  MA.flashcards = {
    title: "Study",
    renderList: renderList,
    routes: {
      deck: renderDeck, cards: renderCards, learn: renderLearn, match: renderMatch, test: renderTest,
      diagrams: function (id) { return MA.diagrams.renderDeckGallery(id); }
    }
  };
})();

</script>
<script>
/* ---- js/modules/diagrams.js ---- */
/* diagrams.js — offline Servier Medical Art galleries attached to the flashcard
   decks and the 3D anatomy section. Images live in diagrams/<topic>/ and are
   indexed by diagrams/index.json (keyed by body system). Servier Medical Art is
   licensed CC BY 4.0 (https://smart.servier.com) — attribution is shown in-app. */
(function () {
  "use strict";
  var MA = window.MA, U = MA.util, el = U.el;

  // Body systems surfaced by each deck.
  var ANATOMY_SYS = ["Cardiovascular", "Respiratory", "Blood / Immune", "Lymphatic / Immune", "Digestive", "Urinary", "Endocrine", "Reproductive", "Integumentary", "Nervous", "Musculoskeletal", "Sensory"];
  var DECK_SYSTEMS = {
    "anatomy": ANATOMY_SYS,
    "teas-science": ["Cellular Biology"].concat(ANATOMY_SYS)
  };
  // 3D model id -> the system whose diagrams to show beneath it.
  var TOPIC_SYS = { heart: "Cardiovascular", skeleton: "Musculoskeletal", skull: "Musculoskeletal", lungs: "Respiratory", brain: "Nervous", cell: "Cellular Biology", kidney: "Urinary", dna: "Cellular Biology", "upper-limb": "Musculoskeletal", "lower-limb": "Musculoskeletal", hand: "Musculoskeletal" };

  var _idx = null;
  function index() {
    if (!_idx) _idx = fetch("diagrams/index.json").then(function (r) { return r.ok ? r.json() : {}; }).catch(function () { return {}; });
    return _idx;
  }
  function deckHasDiagrams(deckId) { return !!DECK_SYSTEMS[deckId]; }

  function injectStyle() {
    if (document.getElementById("dgm-style")) return;
    var css = "" +
      ".dgm-sys{font-weight:800;margin:18px 0 8px;color:var(--fg);font-size:var(--fs-md)}" +
      ".dgm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:10px}" +
      ".dgm-thumb{padding:6px;border:1px solid var(--border);border-radius:var(--r);overflow:hidden;background:#fff;cursor:pointer;aspect-ratio:1/1}" +
      ".dgm-thumb img{width:100%;height:100%;object-fit:contain;display:block}" +
      ".dgm-credit{font-size:var(--fs-xs);color:var(--muted-fg);margin-top:16px;line-height:1.5}" +
      ".dgm-credit a{color:var(--primary)}" +
      ".dgm-lb{position:fixed;inset:0;z-index:9000;background:rgba(0,0,0,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;gap:14px}" +
      ".dgm-lb img{max-width:100%;max-height:76vh;object-fit:contain;background:#fff;border-radius:var(--r);padding:8px}" +
      ".dgm-lb__cap{color:#fff;font-size:var(--fs-sm);text-align:center;max-width:60ch;padding-bottom:env(safe-area-inset-bottom)}" +
      ".dgm-lb__close{position:absolute;top:calc(12px + env(safe-area-inset-top));right:16px;background:#fff;border:none;border-radius:999px;width:42px;height:42px;font-size:20px;cursor:pointer}";
    document.head.appendChild(el("style", { id: "dgm-style", html: css }));
  }

  function lightbox(item) {
    var lb = el("div", { class: "dgm-lb", role: "dialog", "aria-modal": "true", "aria-label": item.title });
    var close = el("button", { class: "dgm-lb__close", "aria-label": "Close", text: "✕" });
    function kill() { if (lb.parentNode) lb.parentNode.removeChild(lb); document.removeEventListener("keydown", onKey); }
    function onKey(e) { if (e.key === "Escape") kill(); }
    close.addEventListener("click", kill);
    lb.addEventListener("click", function (e) { if (e.target === lb) kill(); });
    document.addEventListener("keydown", onKey);
    lb.appendChild(close);
    lb.appendChild(el("img", { src: item.file, alt: item.alt }));
    lb.appendChild(el("div", { class: "dgm-lb__cap", text: item.title + " · Servier Medical Art (CC BY 4.0)" }));
    document.body.appendChild(lb);
  }

  function credit() {
    var c = el("div", { class: "dgm-credit" });
    c.innerHTML = 'Illustrations from <a href="https://smart.servier.com" target="_blank" rel="noopener">Servier Medical Art</a>, licensed under <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>.';
    return c;
  }

  // Returns a DOM node; image grids fill in after index.json resolves.
  function gallery(systems, opts) {
    opts = opts || {};
    injectStyle();
    var wrap = el("div");
    var body = el("div");
    wrap.appendChild(body);
    body.appendChild(el("div", { class: "muted center", text: "Loading diagrams…" }));
    index().then(function (idx) {
      body.innerHTML = "";
      var any = false;
      systems.forEach(function (sys) {
        var items = idx[sys] || [];
        if (!items.length) return;
        any = true;
        if (!opts.flat) body.appendChild(el("div", { class: "dgm-sys", text: sys }));
        var grid = el("div", { class: "dgm-grid" });
        items.forEach(function (it) {
          var btn = el("button", { class: "dgm-thumb", "aria-label": it.title });
          btn.appendChild(el("img", { loading: "lazy", src: it.file, alt: it.alt }));
          btn.addEventListener("click", function () { lightbox(it); });
          grid.appendChild(btn);
        });
        body.appendChild(grid);
      });
      if (!any) body.appendChild(el("div", { class: "muted center", text: "Open this screen once while online and the diagrams will cache for offline use." }));
      else wrap.appendChild(credit());
    });
    return wrap;
  }

  function renderDeckGallery(deckId) {
    var systems = DECK_SYSTEMS[deckId] || [];
    var wrap = el("div", { class: "stack" });
    wrap.appendChild(el("div", { class: "hero" }, [
      el("div", { class: "pill", text: "Visual Atlas" }),
      el("h2", { text: "Diagrams" }),
      el("div", { class: "muted", text: "Tap any illustration to enlarge" })
    ]));
    wrap.appendChild(gallery(systems));
    return wrap;
  }

  function relatedStrip(system) {
    if (!system) return null;
    var card = el("div", { class: "card", style: "margin-top:12px" });
    card.appendChild(el("div", { class: "section-title", text: "📑 Related diagrams" }));
    card.appendChild(gallery([system], { flat: true }));
    return card;
  }

  MA.diagrams = {
    deckHasDiagrams: deckHasDiagrams,
    renderDeckGallery: renderDeckGallery,
    relatedStrip: relatedStrip,
    gallery: gallery,
    TOPIC_SYS: TOPIC_SYS
  };
})();
</script>
<script>
/* ---- js/modules/quiz.js ---- */
/* quiz.js — quiz banks + an opt-in weekly quiz.
   The weekly quiz is chosen deterministically from the ISO week so it's the same
   all week, fully offline, and resets automatically each new week. */
(function () {
  "use strict";
  var MA = window.MA, U = MA.util, el = U.el;

  function banks() { return (window.MA_DATA && MA_DATA.quizzes) || []; }
  function bankById(id) { return banks().filter(function (q) { return q.id === id; })[0]; }

  function scoreCard(score, total, onBack) {
    var pct = Math.round((score / total) * 100);
    var emoji = pct >= 80 ? "🏆" : pct >= 60 ? "👍" : "📚";
    var R = 58, CIRC = 2 * Math.PI * R, off = CIRC * (1 - pct / 100);
    var ringColor = pct >= 80 ? "var(--success)" : pct >= 60 ? "var(--primary)" : "var(--warm)";
    var card = el("div", { class: "empty" });
    var ring = el("div", { class: "score-ring" });
    ring.innerHTML =
      '<svg width="148" height="148" viewBox="0 0 148 148">' +
        '<circle cx="74" cy="74" r="' + R + '" fill="none" stroke="var(--muted-2)" stroke-width="13"/>' +
        '<circle cx="74" cy="74" r="' + R + '" fill="none" stroke="' + ringColor + '" stroke-width="13" stroke-linecap="round" ' +
          'stroke-dasharray="' + CIRC.toFixed(1) + '" stroke-dashoffset="' + off.toFixed(1) + '" transform="rotate(-90 74 74)"/>' +
      '</svg>' +
      '<div class="score-ring__center"><span class="score-ring__emoji">' + emoji + '</span><span class="score-ring__pct">' + pct + '%</span></div>';
    card.appendChild(el("div", { class: "empty__emoji", text: emoji, style: "position:absolute;left:-9999px" })); // keeps celebration trigger, visually hidden
    card.appendChild(ring);
    card.appendChild(el("h3", { text: score + " / " + total + " correct" }));
    card.appendChild(el("p", { class: "muted", text: pct >= 80 ? "Excellent work, Jenny! 💜" : pct >= 60 ? "Solid — review the misses and go again." : "Keep at it — repetition builds recall." }));
    card.appendChild(el("button", { class: "btn btn--primary", onclick: onBack }, "Done"));
    return card;
  }

  /* ---- generic runner over a question bank ---- */
  function runBank(bank, opts) {
    opts = opts || {};
    var qs = U.shuffle(bank.questions, opts.seed).slice(0, opts.limit || bank.questions.length);
    var wrap = el("div", { class: "stack" });
    var head = el("div", { class: "hero" }, [
      el("div", { class: "pill", text: bank.subject }),
      el("h2", { text: opts.title || bank.title }),
      el("div", { class: "muted", text: qs.length + " questions" })
    ]);
    var body = el("div"); wrap.appendChild(head); wrap.appendChild(body);
    var idx = 0, score = 0;
    step();
    function step() {
      body.innerHTML = "";
      if (idx >= qs.length) {
        if (opts.onFinish) opts.onFinish(score, qs.length);
        body.appendChild(scoreCard(score, qs.length, opts.onBack || function () { MA.app.go("quiz"); }));
        return;
      }
      var q = qs[idx];
      // keep choices stable but shuffle display order, tracking the correct text
      var correctText = q.choices[q.answer];
      var shown = U.shuffle(q.choices);
      body.appendChild(el("div", { class: "muted center", text: (idx + 1) + " / " + qs.length }));
      body.appendChild(el("div", { class: "card" }, [el("h3", { text: q.q })]));
      var answered = false;
      shown.forEach(function (choice) {
        var b = el("button", { class: "opt", text: choice });
        b.addEventListener("click", function () {
          if (answered) return; answered = true;
          var ok = choice === correctText;
          if (ok) { b.classList.add("correct"); score++; }
          else {
            b.classList.add("wrong");
            Array.prototype.forEach.call(body.querySelectorAll(".opt"), function (o) { if (o.textContent === correctText) o.classList.add("correct"); });
          }
          Array.prototype.forEach.call(body.querySelectorAll(".opt"), function (o) { o.disabled = true; });
          if (q.explain) body.appendChild(el("div", { class: "card", style: "margin-top:12px", html: "<strong>Why:</strong> " + U.esc(q.explain) }));
          body.appendChild(el("button", { class: "btn btn--primary btn--block", style: "margin-top:14px", onclick: function () { idx++; step(); } }, idx + 1 >= qs.length ? "See score" : "Next question"));
        });
        body.appendChild(b);
      });
    }
    return wrap;
  }

  /* ---- weekly quiz: deterministic per ISO week, mixes all banks ---- */
  function weeklyPool() {
    var all = [];
    banks().forEach(function (b) { b.questions.forEach(function (q) { all.push(q); }); });
    return all;
  }
  function weeklyBank() {
    var wk = U.weekKey();
    var pool = U.shuffle(weeklyPool(), wk).slice(0, 10);
    return { id: "weekly-" + wk, title: "Weekly Quiz · " + wk, subject: "Weekly", questions: pool };
  }

  function renderHub() {
    var wrap = el("div", { class: "stack" });
    var wk = U.weekKey();

    MA.store.getKV("weeklyOptIn", false).then(function (optIn) {
      MA.store.getKV("weeklyDone", {}).then(function (done) {
        var card = el("div", { class: "card stack" });
        card.appendChild(el("div", { class: "row row--between" }, [
          el("div", {}, [el("h3", { text: "📅 Weekly Quiz" }), el("div", { class: "muted", text: optIn ? "On · resets every week" : "Opted out" })]),
          weeklyToggle(optIn)
        ]));
        if (optIn) {
          if (done[wk]) {
            card.appendChild(el("div", { class: "pill pill--accent", text: "Done this week: " + done[wk].score + "/" + done[wk].total }));
            card.appendChild(el("button", { class: "btn btn--ghost btn--block", onclick: startWeekly }, "Retake"));
          } else {
            card.appendChild(el("button", { class: "btn btn--primary btn--block", onclick: startWeekly }, "Start this week's quiz"));
          }
        } else {
          card.appendChild(el("p", { class: "muted", text: "Turn this on to get a fresh 10-question mixed quiz each week. You can opt out any time." }));
        }
        wrap.insertBefore(card, wrap.firstChild);
      });
    });

    function weeklyToggle(on) {
      var input = el("input", { type: "checkbox", "aria-label": "Weekly quiz opt in" });
      input.checked = !!on;
      input.addEventListener("change", function () {
        MA.store.setKV("weeklyOptIn", input.checked).then(function () { MA.app.go("quiz"); });
      });
      return el("label", { class: "switch" }, [input, el("span", { class: "switch__track" })]);
    }
    function startWeekly() {
      MA.app.setView(runBank(weeklyBank(), {
        seed: wk, title: "Weekly Quiz", onBack: function () { MA.app.go("quiz"); },
        onFinish: function (s, t) {
          MA.store.getKV("weeklyDone", {}).then(function (d) { d[wk] = { score: s, total: t }; MA.store.setKV("weeklyDone", d); });
          MA.app.bumpStreak();
        }
      }), "Weekly Quiz");
    }

    wrap.appendChild(el("div", { class: "section-title", text: "Quiz by subject" }));
    var list = el("div", { class: "list" });
    banks().forEach(function (b) {
      list.appendChild(el("button", { class: "list__item", onclick: function () { MA.app.go("quiz/" + b.id); } }, [
        el("span", { class: "tile__emoji", text: b.emoji || "❓" }),
        el("div", { class: "list__grow" }, [
          el("div", { class: "list__title", text: b.title }),
          el("div", { class: "list__sub", text: b.questions.length + " questions" })
        ]),
        el("span", { class: "chev", text: "›" })
      ]));
    });
    wrap.appendChild(list);
    return wrap;
  }

  function renderBank(id) {
    var b = bankById(id);
    if (!b) return el("div", { class: "empty" }, "Quiz not found.");
    return runBank(b, { onBack: function () { MA.app.go("quiz"); }, onFinish: function () { MA.app.bumpStreak(); } });
  }

  MA.quiz = { title: "Quizzes", scoreCard: scoreCard, renderHub: renderHub, renderBank: renderBank, weeklyBank: weeklyBank };
})();

</script>
<script>
/* ---- js/modules/calendar.js ---- */
/* calendar.js — month calendar where the user adds their own exams (incl. a TEAS
   date type). Events persist on-device; upcoming items show a live countdown. */
(function () {
  "use strict";
  var MA = window.MA, U = MA.util, el = U.el;
  var view = new Date(); view.setDate(1);

  var TYPES = {
    exam: { label: "Exam", emoji: "📝", cls: "exam" },
    teas: { label: "TEAS Test", emoji: "🎯", cls: "exam" },
    study: { label: "Study session", emoji: "📚", cls: "" },
    clinical: { label: "Clinical / shift", emoji: "🩺", cls: "" }
  };

  function startOfDay(ts) { var d = new Date(ts); d.setHours(0, 0, 0, 0); return d.getTime(); }
  function sameDay(a, b) { return startOfDay(a) === startOfDay(b); }

  function render() {
    var wrap = el("div", { class: "stack" });
    var body = el("div"); wrap.appendChild(body);
    MA.store.all("events").then(function (events) {
      events.sort(function (a, b) { return a.date - b.date; });
      body.innerHTML = "";
      body.appendChild(monthCard(events));
      body.appendChild(upcomingCard(events));
      body.appendChild(el("button", { class: "btn btn--primary btn--block", onclick: function () { openEditor(null); } }, "＋ Add exam / event"));
    });

    function monthCard(events) {
      var card = el("div", { class: "card" });
      var label = view.toLocaleDateString(undefined, { month: "long", year: "numeric" });
      card.appendChild(el("div", { class: "row row--between" }, [
        el("button", { class: "btn btn--ghost btn--sm", onclick: function () { view.setMonth(view.getMonth() - 1); MA.app.go("calendar"); } }, "‹"),
        el("h3", { text: label, style: "margin:0" }),
        el("button", { class: "btn btn--ghost btn--sm", onclick: function () { view.setMonth(view.getMonth() + 1); MA.app.go("calendar"); } }, "›")
      ]));
      var grid = el("div", { class: "cal-grid", style: "margin-top:12px" });
      ["S", "M", "T", "W", "T", "F", "S"].forEach(function (d) { grid.appendChild(el("div", { class: "cal-dow", text: d })); });
      var first = new Date(view.getFullYear(), view.getMonth(), 1);
      var startPad = first.getDay();
      var daysInMonth = new Date(view.getFullYear(), view.getMonth() + 1, 0).getDate();
      for (var p = 0; p < startPad; p++) grid.appendChild(el("div", { class: "cal-cell muted-day" }));
      for (var day = 1; day <= daysInMonth; day++) {
        var date = new Date(view.getFullYear(), view.getMonth(), day);
        var dayEvents = events.filter(function (e) { return sameDay(e.date, date.getTime()); });
        var cell = el("button", { class: "cal-cell" + (sameDay(date.getTime(), Date.now()) ? " today" : ""), text: String(day) });
        if (dayEvents.length) {
          var hasExam = dayEvents.some(function (e) { return TYPES[e.type] && TYPES[e.type].cls === "exam"; });
          cell.appendChild(el("span", { class: "dot" + (hasExam ? " exam" : "") }));
        }
        (function (d) { cell.addEventListener("click", function () { daySheet(d, events); }); })(date.getTime());
        grid.appendChild(cell);
      }
      card.appendChild(grid);
      return card;
    }

    function upcomingCard(events) {
      var upcoming = events.filter(function (e) { return startOfDay(e.date) >= startOfDay(Date.now()); }).slice(0, 6);
      var card = el("div", { class: "stack" });
      card.appendChild(el("div", { class: "section-title", text: "Upcoming" }));
      if (!upcoming.length) { card.appendChild(el("div", { class: "empty" }, [el("div", { class: "empty__emoji", text: "🗓️" }), el("p", { class: "muted", text: "No events yet. Add your exam dates to see a countdown." })])); return card; }
      var list = el("div", { class: "list" });
      upcoming.forEach(function (e) {
        var t = TYPES[e.type] || TYPES.exam;
        var dleft = U.daysUntil(e.date);
        var when = dleft === 0 ? "Today" : dleft === 1 ? "Tomorrow" : "in " + dleft + " days";
        list.appendChild(el("button", { class: "list__item", onclick: function () { openEditor(e); } }, [
          el("span", { class: "tile__emoji", text: t.emoji }),
          el("div", { class: "list__grow" }, [
            el("div", { class: "list__title ellipsis", text: e.title }),
            el("div", { class: "list__sub", text: U.fmtDate(e.date, { weekday: "short", month: "short", day: "numeric" }) + " · " + t.label })
          ]),
          el("span", { class: "pill " + (dleft <= 3 ? "pill--accent" : "pill--primary"), text: when })
        ]));
      });
      card.appendChild(list);
      return card;
    }

    function daySheet(ts, events) {
      var dayEvents = events.filter(function (e) { return sameDay(e.date, ts); });
      var box = el("div", { class: "stack" });
      box.appendChild(el("h3", { text: U.fmtDate(ts, { weekday: "long", month: "long", day: "numeric" }) }));
      dayEvents.forEach(function (e) {
        var t = TYPES[e.type] || TYPES.exam;
        box.appendChild(el("button", { class: "list__item", onclick: function () { MA.app.closeSheet(); openEditor(e); } }, [
          el("span", { class: "tile__emoji", text: t.emoji }), el("div", { class: "list__grow", text: e.title })
        ]));
      });
      box.appendChild(el("button", { class: "btn btn--primary btn--block", onclick: function () { MA.app.closeSheet(); openEditor({ date: ts }); } }, "＋ Add on this day"));
      MA.app.openSheet(box);
    }

    function openEditor(ev) {
      ev = ev || {};
      var box = el("div", { class: "stack" });
      box.appendChild(el("h3", { text: ev.id ? "Edit event" : "New event" }));
      var title = el("input", { class: "input", placeholder: "e.g. TEAS exam, Anatomy midterm", value: ev.title || "" });
      var date = el("input", { type: "date", class: "input", value: ev.date ? new Date(ev.date).toISOString().slice(0, 10) : new Date().toISOString().slice(0, 10) });
      var type = el("select", { class: "input" });
      Object.keys(TYPES).forEach(function (k) { var o = el("option", { value: k, text: TYPES[k].emoji + " " + TYPES[k].label }); if (ev.type === k) o.selected = true; type.appendChild(o); });
      var note = el("textarea", { class: "textarea", placeholder: "Optional notes (room, what to bring, topics to review)" }); note.value = ev.note || "";
      box.appendChild(el("div", { class: "field" }, [el("label", { text: "Title" }), title]));
      box.appendChild(el("div", { class: "field" }, [el("label", { text: "Date" }), date]));
      box.appendChild(el("div", { class: "field" }, [el("label", { text: "Type" }), type]));
      box.appendChild(el("div", { class: "field" }, [el("label", { text: "Notes" }), note]));
      box.appendChild(el("button", { class: "btn btn--primary btn--block", onclick: save }, "Save"));
      if (ev.id) box.appendChild(el("button", { class: "btn btn--danger btn--block", onclick: remove }, "Delete"));
      MA.app.openSheet(box);

      function save() {
        if (!title.value.trim()) { MA.app.toast("Add a title"); return; }
        var rec = { id: ev.id, title: title.value.trim(), date: new Date(date.value + "T09:00").getTime(), type: type.value, note: note.value.trim() };
        MA.store.put("events", rec).then(function () { MA.app.closeSheet(); MA.app.toast("Saved"); MA.app.go("calendar"); });
      }
      function remove() { MA.store.del("events", ev.id).then(function () { MA.app.closeSheet(); MA.app.toast("Deleted"); MA.app.go("calendar"); }); }
    }

    return wrap;
  }

  MA.calendar = { title: "Calendar", render: render };
})();

<script>
/* ---- js/modules/notes.js ---- */
/* notes.js — personal notepad with a Letterboxd-style folder/list system.
   Notes are Markdown. Export a single note, or a whole folder as combined .md or
   a .zip of individual .md files (zip writer is built in — no dependencies). */
(function () {
  "use strict";
  var MA = window.MA, U = MA.util, el = U.el;
  var activeFolder = "all"; // 'all' | 'unfiled' | folderId

  function render() {
    var wrap = el("div", { class: "stack" });
    var body = el("div"); wrap.appendChild(body);
    Promise.all([MA.store.all("notes"), MA.store.all("folders")]).then(function (res) {
      var notes = res[0], folders = res[1];
      notes.sort(function (a, b) { return b.updated - a.updated; });
      folders.sort(function (a, b) { return a.created - b.created; });
      body.innerHTML = "";

      // folder chips (lists)
      var chips = el("div", { class: "row", style: "flex-wrap:wrap;gap:8px" });
      chips.appendChild(chip("all", "🗂 All", notes.length));
      chips.appendChild(chip("unfiled", "Unfiled", notes.filter(function (n) { return !n.folderId; }).length));
      folders.forEach(function (f) { chips.appendChild(chip(f.id, (f.emoji || "📁") + " " + f.name, notes.filter(function (n) { return n.folderId === f.id; }).length)); });
      chips.appendChild(el("button", { class: "folder-chip", onclick: newFolder }, "＋ List"));
      body.appendChild(chips);

      // actions
      var visible = notes.filter(function (n) {
        return activeFolder === "all" ? true : activeFolder === "unfiled" ? !n.folderId : n.folderId === activeFolder;
      });
      body.appendChild(el("div", { class: "row", style: "margin-top:12px;gap:8px" }, [
        el("button", { class: "btn btn--primary btn--block", onclick: function () { editNote(null, folders); } }, "＋ New note"),
        visible.length ? el("button", { class: "btn btn--ghost btn--sm", onclick: function () { exportSheet(visible, folders); } }, "⤓ Export") : null
      ]));

      // notes list
      if (!visible.length) {
        body.appendChild(el("div", { class: "empty" }, [el("div", { class: "empty__emoji", text: "📝" }), el("p", { class: "muted", text: "No notes here yet. Tap “New note”." })]));
      } else {
        var stack = el("div", { class: "stack", style: "margin-top:14px" });
        visible.forEach(function (n) {
          var folder = folders.filter(function (f) { return f.id === n.folderId; })[0];
          stack.appendChild(el("div", { class: "note-card", onclick: function () { editNote(n, folders); } }, [
            el("h3", { class: "ellipsis", text: n.title || "Untitled" }),
            el("p", { class: "muted ellipsis", text: (n.body || "").replace(/[#*>`]/g, "").slice(0, 90) || "Empty note" }),
            el("div", { class: "note-card__meta", text: U.fmtDate(n.updated) + (folder ? " · " + (folder.emoji || "📁") + " " + folder.name : "") })
          ]));
        });
        body.appendChild(stack);
      }
    });

    function chip(id, label, count) {
      return el("button", { class: "folder-chip" + (activeFolder === id ? " active" : ""), onclick: function () { activeFolder = id; MA.app.go("notes"); } }, label + " · " + count);
    }
    function newFolder() {
      var box = el("div", { class: "stack" });
      var emoji = el("input", { class: "input", placeholder: "📁", value: "📁", style: "width:64px;text-align:center" });
      var name = el("input", { class: "input", placeholder: "List name (e.g. Cardio, Exam 2, Watch later)" });
      box.appendChild(el("h3", { text: "New list" }));
      box.appendChild(el("div", { class: "row", style: "gap:8px" }, [emoji, name]));
      box.appendChild(el("button", { class: "btn btn--primary btn--block", onclick: function () {
        if (!name.value.trim()) { MA.app.toast("Name the list"); return; }
        MA.store.put("folders", { name: name.value.trim(), emoji: emoji.value.trim() || "📁", created: Date.now() }).then(function (f) { activeFolder = f.id; MA.app.closeSheet(); MA.app.go("notes"); });
      } }, "Create"));
      MA.app.openSheet(box);
    }
    return wrap;
  }

  function editNote(note, folders) {
    note = note || {};
    var box = el("div", { class: "stack" });
    box.appendChild(el("h3", { text: note.id ? "Edit note" : "New note" }));
    var title = el("input", { class: "input", placeholder: "Title", value: note.title || "" });
    var folderSel = el("select", { class: "input" });
    folderSel.appendChild(el("option", { value: "", text: "Unfiled" }));
    folders.forEach(function (f) { var o = el("option", { value: f.id, text: (f.emoji || "📁") + " " + f.name }); if (note.folderId === f.id) o.selected = true; folderSel.appendChild(o); });
    if (!note.folderId && activeFolder !== "all" && activeFolder !== "unfiled") folderSel.value = activeFolder;
    var area = el("textarea", { class: "textarea", placeholder: "Write in Markdown… # heading, **bold**, - lists" }); area.value = note.body || "";

    box.appendChild(el("div", { class: "field" }, [el("label", { text: "Title" }), title]));
    box.appendChild(el("div", { class: "field" }, [el("label", { text: "List / folder" }), folderSel]));
    box.appendChild(el("div", { class: "field" }, [el("label", { text: "Note (Markdown)" }), area]));
    box.appendChild(el("div", { class: "row", style: "gap:8px" }, [
      el("button", { class: "btn btn--primary btn--block", onclick: save }, "Save"),
      el("button", { class: "btn btn--ghost btn--sm", onclick: function () { exportOne(current()); } }, "⤓ .md")
    ]));
    if (note.id) box.appendChild(el("button", { class: "btn btn--danger btn--block", onclick: remove }, "Delete note"));
    MA.app.openSheet(box);

    function current() { return { id: note.id, title: title.value.trim(), body: area.value, folderId: folderSel.value || null, created: note.created || Date.now(), updated: Date.now() }; }
    function save() { MA.store.put("notes", current()).then(function () { MA.app.closeSheet(); MA.app.toast("Saved"); MA.app.go("notes"); }); }
    function remove() { MA.store.del("notes", note.id).then(function () { MA.app.closeSheet(); MA.app.toast("Deleted"); MA.app.go("notes"); }); }
  }

  /* ---------- markdown export ---------- */
  function noteToMd(n) {
    var fm = "---\ntitle: " + (n.title || "Untitled") + "\nupdated: " + new Date(n.updated).toISOString() + "\n---\n\n";
    return fm + "# " + (n.title || "Untitled") + "\n\n" + (n.body || "");
  }
  function safeName(s) { return (s || "untitled").replace(/[^a-z0-9\-_ ]/gi, "").trim().replace(/\s+/g, "-").slice(0, 50) || "note"; }

  function exportOne(n) { U.download(safeName(n.title) + ".md", noteToMd(n), "text/markdown;charset=utf-8"); MA.app.toast("Exported .md"); }

  function exportSheet(notes, folders) {
    var box = el("div", { class: "stack" });
    box.appendChild(el("h3", { text: "Export " + notes.length + " note" + (notes.length > 1 ? "s" : "") }));
    box.appendChild(el("button", { class: "btn btn--primary btn--block", onclick: function () {
      var combined = notes.map(noteToMd).join("\n\n---\n\n");
      U.download("ma-notes.md", combined, "text/markdown;charset=utf-8"); MA.app.closeSheet(); MA.app.toast("Exported combined .md");
    } }, "Combined .md (one file)"));
    box.appendChild(el("button", { class: "btn btn--ghost btn--block", onclick: function () {
      var files = notes.map(function (n, i) { return { name: safeName(n.title) + "-" + (i + 1) + ".md", data: noteToMd(n) }; });
      var blob = zip(files);
      var url = URL.createObjectURL(blob); var a = el("a", { href: url, download: "ma-notes.zip" }); document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      MA.app.closeSheet(); MA.app.toast("Exported .zip");
    } }, "Zip of separate .md files"));
    MA.app.openSheet(box);
  }

  /* ---------- minimal STORE-method ZIP writer (no compression, no deps) ---------- */
  var CRC = (function () { var t = []; for (var n = 0; n < 256; n++) { var c = n; for (var k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
  function crc32(bytes) { var c = 0xFFFFFFFF; for (var i = 0; i < bytes.length; i++) c = CRC[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
  function strBytes(s) { return new TextEncoder().encode(s); }
  function zip(files) {
    var chunks = [], central = [], offset = 0;
    function u16(n) { return [n & 255, (n >>> 8) & 255]; }
    function u32(n) { return [n & 255, (n >>> 8) & 255, (n >>> 16) & 255, (n >>> 24) & 255]; }
    files.forEach(function (f) {
      var name = strBytes(f.name), data = strBytes(f.data), crc = crc32(data);
      var local = [].concat(u32(0x04034b50), u16(20), u16(0), u16(0), u16(0), u16(0), u32(crc), u32(data.length), u32(data.length), u16(name.length), u16(0));
      chunks.push(new Uint8Array(local), name, data);
      var central_hdr = [].concat(u32(0x02014b50), u16(20), u16(20), u16(0), u16(0), u16(0), u16(0), u32(crc), u32(data.length), u32(data.length), u16(name.length), u16(0), u16(0), u16(0), u16(0), u32(0), u32(offset));
      central.push({ hdr: new Uint8Array(central_hdr), name: name });
      offset += local.length + name.length + data.length;
    });
    var cstart = offset, csize = 0;
    central.forEach(function (c) { chunks.push(c.hdr, c.name); csize += c.hdr.length + c.name.length; });
    var end = [].concat(u32(0x06054b50), u16(0), u16(0), u16(central.length), u16(central.length), u32(csize), u32(cstart), u16(0));
    chunks.push(new Uint8Array(end));
    return new Blob(chunks, { type: "application/zip" });
  }

  MA.notes = { title: "Notes", render: render };
})();

</script>
<script>
/* ---- js/modules/facts.js ---- */
/* facts.js — swipeable "fun facts" feed with on-device favorites. */
(function () {
  "use strict";
  var MA = window.MA, U = MA.util, el = U.el;
  function facts() { return (window.MA_DATA && MA_DATA.facts) || []; }

  function render() {
    var wrap = el("div", { class: "stack" });
    var order = U.shuffle(facts());
    var i = 0;
    var card = el("div", { class: "card stack", style: "min-height:220px;justify-content:center" });
    var body = el("div"); card.appendChild(body);
    var favBtn = el("button", { class: "btn btn--ghost btn--sm", "aria-label": "Favorite" });

    MA.store.getKV("factFavs", {}).then(function (favs) {
      function show() {
        var f = order[i];
        body.innerHTML = "";
        body.appendChild(el("div", { class: "fact", text: "💡 " + f.text }));
        body.appendChild(el("div", { class: "fact__src", text: "Source: " + f.source }));
        favBtn.textContent = favs[f.id] ? "★ Saved" : "☆ Save";
        counter.textContent = (i + 1) + " / " + order.length;
      }
      favBtn.addEventListener("click", function () {
        var f = order[i];
        if (favs[f.id]) delete favs[f.id]; else favs[f.id] = f.text;
        MA.store.setKV("factFavs", favs).then(show);
      });
      var counter = el("div", { class: "muted center" });
      var nav = el("div", { class: "row row--between" }, [
        el("button", { class: "btn btn--ghost", onclick: function () { i = (i - 1 + order.length) % order.length; show(); } }, "‹ Prev"),
        favBtn,
        el("button", { class: "btn btn--primary", onclick: function () { i = (i + 1) % order.length; show(); } }, "Next ›")
      ]);
      // swipe support
      var sx = 0;
      card.addEventListener("touchstart", function (e) { sx = e.touches[0].clientX; }, { passive: true });
      card.addEventListener("touchend", function (e) {
        var dx = e.changedTouches[0].clientX - sx;

      });
      wrap.appendChild(el("p", { class: "muted center", text: "Swipe or tap to flip through. Save your favorites." }));
      wrap.appendChild(counter); wrap.appendChild(card); wrap.appendChild(nav);

  MA.facts = { title: "Fun Facts", render: render };

<script>
/* ---- js/modules/viewer3d.js ---- */
/* viewer3d.js — interactive 3D anatomy diagrams using pure CSS 3D transforms.
   No WebGL library, no downloads: works fully offline from a folder, light on a phone.
   Drag to rotate, pinch/scroll to zoom, tap a labeled part to learn it.
   (Stylized educational diagrams; real CC0 .glb models can be added later — see README.) */
(function () {
  "use strict";
  var MA = window.MA, U = MA.util, el = U.el;
  function topics() { return (window.MA_DATA && MA_DATA.topics) || []; }

  injectStyle();

  function render(topicId, tab) {
    var wrap = el("div", { class: "stack" });

    // topic chips
    var chips = el("div", { class: "row", style: "flex-wrap:wrap;gap:8px" });
    topics().forEach(function (t) {
      chips.appendChild(el("button", { class: "folder-chip" + (t.id === topicId ? " active" : ""), onclick: function () { MA.app.go("anatomy/" + t.id); } }, (t.emoji || "") + " " + t.name));
    });
    wrap.appendChild(chips);

    var topic = topics().filter(function (t) { return t.id === topicId; })[0] || topics()[0];
    if (!topic) return el("div", { class: "empty" }, "No 3D topics.");

    // anatomy topic header strip
    wrap.appendChild(el("div", { class: "anatomy-header" }, [
      el("div", { class: "anatomy-header__icon", text: topic.emoji || "🫀" }),
      el("div", { class: "anatomy-header__body" }, [
        el("div", { class: "anatomy-header__title", text: topic.name }),
        el("div", { class: "anatomy-header__blurb", text: topic.blurb || "" })
      ]),
      el("span", { class: "anatomy-header__badge", text: "3D" })
    ]));

    // sub-tabs: Info | 3D Visual
    var activeTab = tab === "3d" ? "3d" : "info";
    var tabBar = el("div", { class: "anatomy-tabs" }, [
      el("button", { class: "anatomy-tab" + (activeTab === "info" ? " active" : ""), onclick: function () { MA.app.go("anatomy/" + topic.id + "/info"); } }, "📋 Info"),
      el("button", { class: "anatomy-tab" + (activeTab === "3d" ? " active" : ""), onclick: function () { MA.app.go("anatomy/" + topic.id + "/3d"); } }, "🫀 3D Visual")
    ]);
    wrap.appendChild(tabBar);

    if (activeTab === "3d") {
      // stage — real GLB via three.js when available, else procedural CSS-3D.
      var stage = el("div", { class: "v3d", role: "img", "aria-label": "3D model of " + topic.name, style: "position:relative" });
      if (topic.glb) {
        mountGL(stage, topic);
        if (topic.placeholder) {
          stage.appendChild(el("div", { class: "v3d__placeholder-banner", text: "⚠ Stand-in model (Skeleton) — " + topic.name + " GLB coming soon" }));
        }
      } else {
        mountProc(stage, topic);
      }
      wrap.appendChild(stage);
      var partInfo = el("div", { id: "v3dPart", class: "card muted", style: "margin-top:10px;font-size:var(--fs-sm)", text: "Tap a labeled part to see what it is." });
      wrap.appendChild(partInfo);
      var quizBtn = MA.anatomyQuiz && MA.anatomyQuiz.entryButton(topic.id);
      if (quizBtn) wrap.appendChild(quizBtn);
    } else {
      // info tab
      var info = el("div", { class: "card", style: "margin-top:4px" }, [
        el("p", { class: "muted", text: topic.blurb }),
        el("div", { id: "v3dPart", class: "muted", style: "display:none" }),
        topic.deck ? el("button", { class: "btn btn--accent btn--block", style: "margin-top:14px", onclick: function () { MA.app.go("study/" + topic.deck); } }, "📑 Study related flashcards") : null,
        (MA.anatomyQuiz && MA.anatomyQuiz.entryButton(topic.id)) || null
      ]);
      wrap.appendChild(info);
      var strip = MA.diagrams && MA.diagrams.relatedStrip(MA.diagrams.TOPIC_SYS[topic.id]);
      if (strip) wrap.appendChild(strip);
    }

    return wrap;
  }

  /* ---------- procedural CSS-3D mount (fallback / topics without a GLB) ---------- */
  function mountProc(stage, topic) {
    stage.innerHTML = "";
    var scene = el("div", { class: "v3d__scene" });
    stage.appendChild(scene);
    stage.appendChild(el("div", { class: "viewer__hint", text: "Drag to rotate · pinch/scroll to zoom · tap a label" }));
    buildModel(scene, topic);
    enableControls(stage, scene);
  }

  /* ---------- real GLB mount via bundled three.js ---------- */
  function glPath(topic) {
    var m = topic.model || "";
    return m.indexOf("/") >= 0 ? m : "models/" + m;
  }

  function mountGL(stage, topic) {
    stage.innerHTML = "";
    var canvas = el("canvas", { class: "v3d__gl" });
    stage.appendChild(canvas);
    var hint = el("div", { class: "viewer__hint", text: "Loading 3D model…" });
    stage.appendChild(hint);

    function fallback() { mountProc(stage, topic); }

    function build() {
      var M = window.MA3D;
      if (!M) { fallback(); return; }
      var THREE = M.THREE, renderer;
      try {
        renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
      } catch (e) { fallback(); return; }
      renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));

      var scene = new THREE.Scene();
      var camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
      camera.position.set(0, 0, 3);
      scene.add(new THREE.HemisphereLight(0xffffff, 0x223344, 1.15));
      var key = new THREE.DirectionalLight(0xffffff, 1.0); key.position.set(2, 3, 4); scene.add(key);
      var rim = new THREE.DirectionalLight(0xbfefff, 0.5); rim.position.set(-3, -1, -2); scene.add(rim);

      var controls = new M.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true; controls.dampingFactor = 0.08;
      controls.autoRotate = !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      controls.autoRotateSpeed = 1.2;
      controls.addEventListener("start", function () { controls.autoRotate = false; });

      function resize() {
        var w = stage.clientWidth || 1, h = stage.clientHeight || 1;
        renderer.setSize(w, h, false);
        camera.aspect = w / h; camera.updateProjectionMatrix();
      }
      resize();
      var ro = window.ResizeObserver ? new ResizeObserver(resize) : null;
      if (ro) ro.observe(stage); else window.addEventListener("resize", resize);

      var raf = 0, disposed = false;
      function loop() { if (disposed) return; controls.update(); renderer.render(scene, camera); raf = requestAnimationFrame(loop); }

      function dispose() {
        if (disposed) return;
        disposed = true; cancelAnimationFrame(raf);
        if (ro) ro.disconnect(); else window.removeEventListener("resize", resize);
        controls.dispose();
        scene.traverse(function (o) {
          if (o.geometry && o.geometry.dispose) o.geometry.dispose();
          if (o.material) {
            var mats = Array.isArray(o.material) ? o.material : [o.material];
            mats.forEach(function (mm) {
              for (var k in mm) { if (mm[k] && mm[k].isTexture) mm[k].dispose(); }
              if (mm.dispose) mm.dispose();
            });
          }
        });
        renderer.dispose();
      }
      MA.app.onLeave(dispose);

      var loader = new M.GLTFLoader();
      if (M.draco) loader.setDRACOLoader(M.draco);
      loader.load(glPath(topic), function (gltf) {
        var root = gltf.scene || (gltf.scenes && gltf.scenes[0]);
        if (!root) { dispose(); fallback(); return; }
        var box = new THREE.Box3().setFromObject(root);
        var size = new THREE.Vector3(); box.getSize(size);
        var center = new THREE.Vector3(); box.getCenter(center);
        root.position.sub(center);                 // center the model on the origin
        var group = new THREE.Group(); group.add(root); // scale the wrapper so centering is preserved
        var maxDim = Math.max(size.x, size.y, size.z) || 1;
        group.scale.setScalar(1.7 / maxDim);
        scene.add(group);
        controls.target.set(0, 0, 0); controls.update();
        hint.textContent = "Drag to rotate · scroll to zoom";
        loop();
      }, undefined, function () { dispose(); fallback(); });
    }

    if (window.MA3D) { build(); return; }
    var done = false;
    function onReady() { if (done) return; done = true; window.removeEventListener("ma3d-ready", onReady); build(); }
    window.addEventListener("ma3d-ready", onReady);
    setTimeout(function () {
      if (done) return; done = true; window.removeEventListener("ma3d-ready", onReady);
      if (window.MA3D) build(); else fallback();
    }, 10000);
  }

  /* ---------- controls: drag-rotate + zoom ---------- */
  function enableControls(stage, scene) {
    var rx = -18, ry = 24, scale = 1, dragging = false, lx = 0, ly = 0, pinch0 = 0, s0 = 1;
    var idle = !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    function apply() { scene.style.transform = "translateZ(-40px) rotateX(" + rx + "deg) rotateY(" + ry + "deg) scale(" + scale + ")"; }
    apply();
    var raf;
    function spin() { if (idle && !dragging) { ry += 0.25; apply(); } raf = requestAnimationFrame(spin); }
    spin();
    MA.app.onLeave(function () { cancelAnimationFrame(raf); });

    stage.addEventListener("pointerdown", function (e) { dragging = true; idle = false; lx = e.clientX; ly = e.clientY; stage.setPointerCapture(e.pointerId); });
    stage.addEventListener("pointermove", function (e) {
      if (!dragging) return;
      ry += (e.clientX - lx) * 0.4; rx -= (e.clientY - ly) * 0.4;
      rx = Math.max(-89, Math.min(89, rx)); lx = e.clientX; ly = e.clientY; apply();
    });
    function end() { dragging = false; }
    stage.addEventListener("pointerup", end); stage.addEventListener("pointercancel", end);
    stage.addEventListener("wheel", function (e) { e.preventDefault(); scale = Math.max(0.5, Math.min(2.4, scale - e.deltaY * 0.0015)); apply(); }, { passive: false });
    stage.addEventListener("touchstart", function (e) { if (e.touches.length === 2) { pinch0 = dist(e); s0 = scale; } }, { passive: true });
    stage.addEventListener("touchmove", function (e) { if (e.touches.length === 2 && pinch0) { scale = Math.max(0.5, Math.min(2.4, s0 * dist(e) / pinch0)); apply(); } }, { passive: true });
    function dist(e) { var a = e.touches[0], b = e.touches[1]; return Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY); }
  }

  /* ---------- model builders ---------- */
  function node(cfg) {
    var n = el("div", { class: "v3d__node" + (cfg.box ? " v3d__box" : ""), title: cfg.label || "" });
    var sz = cfg.size || 60;
    n.style.width = sz + "px"; n.style.height = (cfg.h || sz) + "px";
    n.style.background = cfg.color || "radial-gradient(circle at 30% 30%, #fff6, #0891B2)";
    n.style.transform = "translate3d(" + (cfg.x || 0) + "px," + (cfg.y || 0) + "px," + (cfg.z || 0) + "px)";
    if (cfg.box) n.style.borderRadius = (cfg.r != null ? cfg.r : 10) + "px";
    if (cfg.label) {
      var lab = el("span", { class: "v3d__label", text: cfg.label });
      n.appendChild(lab);
      n.addEventListener("click", function (e) { e.stopPropagation(); var p = document.getElementById("v3dPart"); if (p) p.innerHTML = "<strong>" + U.esc(cfg.label) + "</strong>" + (cfg.desc ? " — " + U.esc(cfg.desc) : ""); });
    }
    return n;
  }

  function buildModel(scene, topic) {
    scene.innerHTML = "";
    var parts = SPECS[topic.proc] ? SPECS[topic.proc](topic) : SPECS.generic(topic);
    parts.forEach(function (p) { scene.appendChild(node(p)); });
  }

  var COL = {
    red: "radial-gradient(circle at 30% 30%, #ff9aa2, #c0392b)",
    blue: "radial-gradient(circle at 30% 30%, #aee1f9, #1f6fb2)",
    bone: "radial-gradient(circle at 30% 30%, #fffef0, #d8d2b8)",
    pink: "radial-gradient(circle at 30% 30%, #ffd1dc, #d46a8a)",
    teal: "radial-gradient(circle at 30% 30%, #b6f3ec, #0e9aa7)",
    green: "radial-gradient(circle at 30% 30%, #c8f7c5, #2e8b57)",
    purp: "radial-gradient(circle at 30% 30%, #e3c8ff, #7c3aed)"
  };

  var SPECS = {
    generic: function (t) {
      return [{ size: 120, color: COL.teal, label: t.name, desc: t.blurb }];
    },
    heart: function () {
      return [
        { box: true, size: 70, h: 90, x: -38, y: -30, z: 20, color: COL.red, label: "RA", desc: "Right atrium — receives oxygen-poor blood from the body." },
        { box: true, size: 70, h: 110, x: -38, y: 40, z: 20, color: COL.red, label: "RV", desc: "Right ventricle — pumps blood to the lungs." },
        { box: true, size: 70, h: 90, x: 38, y: -30, z: -20, color: COL.blue, label: "LA", desc: "Left atrium — receives oxygen-rich blood from the lungs." },
        { box: true, size: 70, h: 120, x: 38, y: 45, z: -20, color: COL.blue, label: "LV", desc: "Left ventricle — pumps oxygen-rich blood to the body (thickest wall)." },
        { size: 36, x: 0, y: -90, z: 0, color: COL.pink, label: "Aorta", desc: "Largest artery — carries blood from the LV to the body." }
      ];
    },
    cell: function () {
      var parts = [
        { size: 230, x: 0, y: 0, z: 0, color: "radial-gradient(circle at 35% 30%, #bdeef0aa, #0e9aa733)", label: "" },
        { size: 90, x: 0, y: 0, z: 0, color: COL.purp, label: "Nucleus", desc: "Control center — holds DNA." }
      ];
      var organelles = [
        { label: "Mitochondria", desc: "Powerhouse — makes ATP energy.", color: COL.red },
        { label: "Ribosome", desc: "Builds proteins.", color: COL.teal },
        { label: "ER", desc: "Endoplasmic reticulum — transports materials.", color: COL.green },
        { label: "Golgi", desc: "Packages and ships proteins.", color: COL.pink },
        { label: "Lysosome", desc: "Digests waste.", color: COL.blue }
      ];
      organelles.forEach(function (o, i) {
        var a = (i / organelles.length) * Math.PI * 2;
        parts.push({ size: 44, x: Math.cos(a) * 78, y: Math.sin(a) * 70, z: Math.sin(a * 1.7) * 60, color: o.color, label: o.label, desc: o.desc });
      });
      return parts;
    },
    dna: function () {
      var parts = [], bases = ["A", "T", "G", "C"];
      for (var i = 0; i < 12; i++) {
        var a = i * 0.55, y = i * 26 - 150;
        parts.push({ size: 22, x: Math.cos(a) * 60, y: y, z: Math.sin(a) * 60, color: COL.teal, label: i === 0 ? "Backbone" : "", desc: "Sugar-phosphate backbone." });
        parts.push({ size: 22, x: Math.cos(a + Math.PI) * 60, y: y, z: Math.sin(a + Math.PI) * 60, color: COL.purp, label: "" });
        parts.push({ box: true, r: 4, size: 110, h: 8, x: 0, y: y, z: 0, color: i % 2 ? COL.pink : COL.green, label: i === 6 ? "Base pair (" + bases[i % 4] + ")" : "", desc: "Complementary base pairs (A-T, G-C) form the rungs." });
      }
      return parts;
    },
    skeleton: function () {
      return [
        { box: true, r: 30, size: 60, h: 60, x: 0, y: -120, z: 0, color: COL.bone, label: "Skull", desc: "Protects the brain." },
        { box: true, r: 8, size: 26, h: 120, x: 0, y: -10, z: 0, color: COL.bone, label: "Spine", desc: "Vertebral column — 33 vertebrae." },
        { box: true, r: 40, size: 130, h: 90, x: 0, y: -30, z: -10, color: "radial-gradient(circle at 40% 30%, #fffef0cc, #d8d2b855)", label: "Rib cage", desc: "Protects heart and lungs." },
        { box: true, r: 8, size: 22, h: 140, x: -45, y: 90, z: 0, color: COL.bone, label: "Femur", desc: "Longest bone in the body." },
        { box: true, r: 8, size: 22, h: 140, x: 45, y: 90, z: 0, color: COL.bone, label: "" }
      ];
    },
    skull: function () {
      return [
        { size: 150, x: 0, y: -20, z: 0, color: COL.bone, label: "Cranium", desc: "Houses and protects the brain." },
        { box: true, r: 16, size: 90, h: 60, x: 0, y: 70, z: 30, color: "radial-gradient(circle at 40% 30%, #fffef0, #cfc9ad)", label: "Mandible", desc: "Lower jaw — the only movable skull bone." },
        { size: 26, x: -32, y: -10, z: 60, color: "#222", label: "Orbit", desc: "Eye socket." },
        { size: 26, x: 32, y: -10, z: 60, color: "#222", label: "" }
      ];
    },
    lungs: function () {
      return [
        { box: true, r: 40, size: 80, h: 150, x: -50, y: 10, z: 0, color: COL.pink, label: "Left lung", desc: "Two lobes (smaller — shares space with the heart)." },
        { box: true, r: 40, size: 85, h: 160, x: 50, y: 5, z: 0, color: COL.pink, label: "Right lung", desc: "Three lobes." },
        { box: true, r: 8, size: 18, h: 90, x: 0, y: -70, z: 0, color: COL.teal, label: "Trachea", desc: "Windpipe — carries air to the bronchi." }
      ];
    },
    brain: function () {
      return [
        { size: 170, x: 0, y: -20, z: 0, color: COL.pink, label: "Cerebrum", desc: "Thinking, senses, voluntary movement." },
        { size: 70, x: 0, y: 70, z: -30, color: COL.purp, label: "Cerebellum", desc: "Balance and coordination." },
        { box: true, r: 10, size: 28, h: 70, x: 0, y: 90, z: 0, color: COL.teal, label: "Brainstem", desc: "Controls breathing, heart rate (vital functions)." }
      ];
    },
    kidney: function () {
      return [
        { box: true, r: 50, size: 90, h: 140, x: -40, y: 0, z: 0, color: COL.red, label: "Left kidney", desc: "Filters blood, makes urine." },
        { box: true, r: 50, size: 90, h: 140, x: 40, y: 0, z: 0, color: COL.red, label: "Right kidney", desc: "Sits slightly lower than the left." },
        { box: true, r: 6, size: 12, h: 120, x: -20, y: 120, z: 0, color: COL.teal, label: "Ureter", desc: "Carries urine to the bladder." }
      ];
    }
  };

  function injectStyle() {
    if (document.getElementById("v3d-style")) return;
    var css = "" +
      ".v3d{width:100%;height:58vh;min-height:340px;border-radius:var(--r-lg);overflow:hidden;position:relative;touch-action:none;cursor:grab;" +
      "background:radial-gradient(120% 90% at 50% 10%,#103642,#06141a);perspective:900px;border:1px solid var(--border);}" +
      ".v3d:active{cursor:grabbing}" +
      ".v3d__gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}" +
      ".v3d__scene{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d;transition:transform .05s linear}" +
      ".v3d__node{position:absolute;left:0;top:0;margin-left:-30px;margin-top:-30px;border-radius:50%;transform-style:preserve-3d;" +
      "box-shadow:inset -6px -8px 16px rgba(0,0,0,.35),0 8px 22px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;cursor:pointer}" +
      ".v3d__box{border-radius:10px}" +
      ".v3d__label{position:absolute;top:-6px;left:50%;transform:translate(-50%,-100%);background:rgba(8,55,66,.9);color:#eafcff;font-size:11px;font-weight:700;" +
      "padding:2px 7px;border-radius:999px;white-space:nowrap;pointer-events:none}";
    document.head.appendChild(el("style", { id: "v3d-style", html: css }));
  }

  MA.viewer3d = { title: "Anatomy 3D", render: render };
})();
