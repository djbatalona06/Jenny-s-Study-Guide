<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Jenny's TEAS Study Guide</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="app-header">
    <h1>Jenny's TEAS 7 Study Guide</h1>
    <p class="subtitle">Science flashcards — Anatomy &amp; Physiology, Biology, Chemistry, Scientific Reasoning</p>
  </header>

  <main class="app-main">
    <section class="controls">
      <div class="control-group">
        <label for="category-select">Category</label>
        <select id="category-select">
          <option value="all">All categories</option>
        </select>
      </div>

      <div class="control-group">
        <label for="subcategory-select">Topic</label>
        <select id="subcategory-select">
          <option value="all">All topics</option>
        </select>
      </div>

      <div class="control-group">
        <label for="search-input">Search</label>
        <input id="search-input" type="text" placeholder="Search questions or answers…" />
      </div>

      <div class="control-group checkbox-group">
        <label><input type="checkbox" id="starred-only" /> Starred only</label>
        <label><input type="checkbox" id="unknown-only" /> Needs review only</label>
      </div>
    </section>

    <section class="stats-bar" id="stats-bar"></section>

    <section class="card-area">
      <div class="card-nav">
        <button id="prev-btn" class="nav-btn" aria-label="Previous card">‹</button>

        <div class="flashcard" id="flashcard" tabindex="0" role="button" aria-pressed="false">
          <div class="flashcard-inner" id="flashcard-inner">
            <div class="flashcard-face flashcard-front">
              <span class="card-category" id="card-category"></span>
              <p class="card-text" id="card-question"></p>
              <span class="flip-hint">Click to reveal answer</span>
            </div>
            <div class="flashcard-face flashcard-back">
              <span class="card-category" id="card-category-back"></span>
              <p class="card-text" id="card-answer"></p>
              <span class="flip-hint">Click to see question</span>
            </div>
          </div>
        </div>

        <button id="next-btn" class="nav-btn" aria-label="Next card">›</button>
      </div>

      <div class="card-toolbar">
        <button id="star-btn" class="toolbar-btn" title="Star this card">☆ Star</button>
        <button id="know-btn" class="toolbar-btn know-btn" title="Mark as known">✓ Know it</button>
        <button id="unknown-btn" class="toolbar-btn unknown-btn" title="Mark as needs review">✗ Needs review</button>
        <button id="shuffle-btn" class="toolbar-btn" title="Shuffle deck">⤨ Shuffle</button>
        <button id="reset-btn" class="toolbar-btn" title="Reset progress">↺ Reset progress</button>
      </div>

      <div class="progress-text" id="progress-text"></div>
    </section>
  </main>

  <footer class="app-footer">
    <p>126 cards · Built from the official ATI TEAS 7 Science blueprint</p>
  </footer>

  <script src="data/flashcards.js"></script>
  <script src="js/app.js"></script>
  <!-- Vercel Speed Insights -->
  <script type="module" src="js/speed-insights.js"></script>
</body>
</html>
