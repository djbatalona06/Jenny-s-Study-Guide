<script>
/* ---- js/modules/anatomy-quiz.js ---- */
/* anatomy-quiz.js — "Identify the Part": a short multiple-choice quiz per anatomy
   topic, built from the cards of the topic's linked flashcard deck. The card's
   definition is the prompt; the options are that card's term plus three
   distractor terms from the same deck. Correct answers earn coins through
   MA.economy.earnCoins, so the streak x character multiplier applies. */
(function () {
  "use strict";
  var MA = window.MA, U = MA.util, el = U.el;

  var MAX_Q = 8;
  var MIN_CARDS = 4;

  function topics() { return (window.MA_DATA && MA_DATA.topics) || []; }
  function decks() { return (window.MA_DATA && MA_DATA.decks) || []; }
  function topicById(id) { return topics().filter(function (t) { return t.id === id; })[0]; }
  function deckById(id) { return decks().filter(function (d) { return d.id === id; })[0]; }

  /* Cards usable as questions: need both a term and a definition. */
  function usableCards(topic) {
    if (!topic || !topic.deck) return [];
    var deck = deckById(topic.deck);
    if (!deck || !deck.cards) return [];
    return deck.cards.filter(function (c) { return c && c.term && c.def; });
  }

  function isAvailable(topicId) { return usableCards(topicById(topicId)).length >= MIN_CARDS; }

  /* Most decks mix two card shapes: some terms are already phrased as questions
     ("What plane divides…?" / "Frontal plane"), the rest are label-and-description
     ("Tricuspid valve" / "Valve between…"). Ask each card from whichever side reads
     as the prompt, and draw distractors from the same pool so the four options are
     always the same kind of thing. */
  function isAsked(card) { return /\?\s*$/.test(card.term); }
  function promptOf(card) { return isAsked(card) ? card.term : card.def; }
  function answerOf(card) { return isAsked(card) ? card.def : card.term; }

  /* Build the question list. Seeded per topic so a reload gives the same quiz. */
  function buildQuestions(topic) {
    var cards = usableCards(topic);
    if (cards.length < MIN_CARDS) return [];
    var asked = cards.filter(isAsked), labelled = cards.filter(function (c) { return !isAsked(c); });
    var picked = U.shuffle(cards, topic.id).slice(0, Math.min(MAX_Q, cards.length));
    return picked.map(function (card, i) {
      var pool = isAsked(card) ? asked : labelled;
      var answer = answerOf(card);
      var others = pool.filter(function (c) { return answerOf(c) !== answer; });
      // a pool too small for 3 distractors falls back to the full deck
      if (others.length < 3) others = cards.filter(function (c) { return answerOf(c) !== answer; });
      var distractors = U.shuffle(others, topic.id + ":" + i).slice(0, 3).map(answerOf);
      return {
        prompt: promptOf(card),
        answer: answer,
        choices: U.shuffle([answer].concat(distractors), topic.id + ":opt:" + i)
      };
    });
  }

  function start(topicId) {
    var topic = topicById(topicId);
    if (!topic) { MA.app.toast("Topic not found."); return; }
    var qs = buildQuestions(topic);
    if (!qs.length) { MA.app.toast("Not enough cards for a quiz yet."); return; }
    MA.app.setView(renderQuiz(topic, qs), "Identify the Part");
  }

  function renderQuiz(topic, qs) {
    var wrap = el("div", { class: "stack" });
    wrap.appendChild(el("div", { class: "hero" }, [
      el("div", { class: "pill", text: (topic.emoji || "🫀") + " " + topic.name }),
      el("h2", { text: "Identify the Part" }),
      el("div", { class: "muted", text: qs.length + " questions · +8 🪙 each" })
    ]));
    var body = el("div");
    wrap.appendChild(body);

    var idx = 0, score = 0;
    step();

    function step() {
      body.innerHTML = "";
      if (idx >= qs.length) { finish(); return; }
      var q = qs[idx];
      body.appendChild(el("div", { class: "muted center", text: (idx + 1) + " / " + qs.length }));
      body.appendChild(el("div", { class: "card" }, [el("h3", { text: q.prompt })]));
      var answered = false;
      q.choices.forEach(function (choice) {
        var b = el("button", { class: "opt", text: choice });
        b.addEventListener("click", function () {
          if (answered) return; answered = true;
          var ok = choice === q.answer;
          if (ok) {
            b.classList.add("correct");
            score++;
            MA.economy.earnCoins(8, "anatomy", b);
          } else {
            b.classList.add("wrong");
            Array.prototype.forEach.call(body.querySelectorAll(".opt"), function (o) {
              if (o.textContent === q.answer) o.classList.add("correct");
            });
          }
          Array.prototype.forEach.call(body.querySelectorAll(".opt"), function (o) { o.disabled = true; });
          body.appendChild(el("button", {
            class: "btn btn--primary btn--block", style: "margin-top:14px",
            onclick: function () { idx++; step(); }
          }, idx + 1 >= qs.length ? "See score" : "Next question"));
        });
        body.appendChild(b);
      });
    }

    function finish() {
      MA.economy.earnCoins(30, "anatomy-done");
      if (MA.celebrate && score / qs.length >= 0.8) MA.celebrate({ count: 90, y: (window.innerHeight || 800) * 0.4 });
      body.appendChild(MA.quiz.scoreCard(score, qs.length, function () { MA.app.go("anatomy/" + topic.id); }));
    }

    return wrap;
  }

  /* Entry button mounted by the anatomy topic view. Returns null when the
     topic's deck is too small to build a 4-option question. */
  function entryButton(topicId) {
    if (!isAvailable(topicId)) return null;
    return el("button", {
      class: "btn btn--accent btn--block", style: "margin-top:10px",
      "aria-label": "Start the Identify the Part quiz",
      onclick: function () { start(topicId); }
    }, "🔎 Identify the Part");
  }

  MA.anatomyQuiz = { start: start, entryButton: entryButton, isAvailable: isAvailable, buildQuestions: buildQuestions };
})();

</script>
<script>
/* ---- js/modules/library.js ---- */
/* library.js — offline reference library: BSN/TEAS pathway guides, quick-reference
   docs, and any docs added by the build-time pipeline (library/index.json). */
(function () {
  "use strict";
  var MA = window.MA, U = MA.util, el = U.el;
  function guides() { return (window.MA_DATA && MA_DATA.guides) || []; }
  function refs() { return (window.MA_DATA && MA_DATA.refs) || []; }

  function render(docId) {
    if (docId) return readDoc(docId);
    var wrap = el("div", { class: "stack" });
    wrap.appendChild(el("p", { class: "muted", text: "Reference docs and the road from MA to BSN — all available offline." }));

    wrap.appendChild(el("div", { class: "section-title", text: "Pathway & TEAS" }));
    wrap.appendChild(docList(guides(), "guide"));

    wrap.appendChild(el("div", { class: "section-title", text: "Quick references" }));
    wrap.appendChild(docList(refs(), "ref"));

    // pipeline-generated docs (present only when served & built)
    var extra = el("div");
    wrap.appendChild(extra);
    tryLoadIndex().then(function (items) {
      if (items && items.length) {
        extra.appendChild(el("div", { class: "section-title", text: "Imported documents" }));
        extra.appendChild(docList(items.map(function (it) { return { id: it.id, title: it.title, tag: it.source || "Imported", file: it.file }; }), "file"));
      }
    });

    wrap.appendChild(el("div", { class: "card", style: "margin-top:18px" }, [
      el("h3", { text: "📥 Add more medical documents" }),
      el("p", { class: "muted", text: "On your computer you can pull more open-source medical docs into this library. See tools/ in the app folder: run fetch_docs.py then convert_docs.py (uses markitdown). The new docs appear here automatically." })
    ]));
    return wrap;
  }

  function docList(items, kind) {
    var list = el("div", { class: "list" });
    if (!items.length) { return el("div", { class: "empty" }, [el("p", { class: "muted", text: "Nothing here yet." })]); }
    items.forEach(function (d) {
      list.appendChild(el("button", { class: "list__item", onclick: function () { MA.app.go("library/" + kind + ":" + d.id); } }, [
        el("span", { class: "tile__emoji", text: "📄" }),
        el("div", { class: "list__grow" }, [el("div", { class: "list__title", text: d.title }), el("div", { class: "list__sub", text: d.tag || "" })]),
        el("span", { class: "chev", text: "›" })
      ]));
    });
    return list;
  }

  function readDoc(docId) {
    var parts = docId.split(":"), kind = parts[0], id = parts.slice(1).join(":");
    var wrap = el("div", { class: "stack" });
    var article = el("article", { class: "card markdown" });
    wrap.appendChild(article);

    var doc;
    if (kind === "guide") doc = guides().filter(function (g) { return g.id === id; })[0];
    else if (kind === "ref") doc = refs().filter(function (r) { return r.id === id; })[0];

    if (doc) {
      article.innerHTML = U.mdToHtml(doc.body);
      wrap.appendChild(el("button", { class: "btn btn--ghost btn--block", onclick: function () { U.download((doc.title || "doc").replace(/[^a-z0-9]+/gi, "-").toLowerCase() + ".md", doc.body, "text/markdown"); } }, "⤓ Export this doc as .md"));
    } else if (kind === "file") {
      article.textContent = "Loading…";
      tryLoadIndex().then(function (items) {
        var it = (items || []).filter(function (x) { return x.id === id; })[0];
        if (!it) { article.textContent = "Document not found."; return; }
        fetch("library/" + it.file).then(function (r) { return r.text(); }).then(function (md) {
          article.innerHTML = U.mdToHtml(md);
        }).catch(function () { article.innerHTML = "<p class='muted'>This imported document can't be read from a raw file:// folder. Open the app from the installed PWA or a local server to view it.</p>"; });
      });
    } else { article.textContent = "Document not found."; }
    return wrap;
  }

  var _idx;
  function tryLoadIndex() {
    if (_idx) return _idx;
    _idx = fetch("library/index.json").then(function (r) { return r.ok ? r.json() : []; }).then(function (j) { return j.docs || j || []; }).catch(function () { return []; });
    return _idx;
  }

  MA.library = { title: "Library", render: render };
})();

</script>

/* settings.js — preferences, weekly-quiz opt in/out, streak, and data controls. */
(function () {
  "use strict";
  var MA = window.MA, U = MA.util, el = U.el;

  function render() {
    var wrap = el("div", { class: "stack" });

    // weekly quiz toggle
    MA.store.getKV("weeklyOptIn", false).then(function (on) {
      var input = el("input", { type: "checkbox", "aria-label": "Weekly quiz" }); input.checked = !!on;
      input.addEventListener("change", function () { MA.store.setKV("weeklyOptIn", input.checked).then(function () { MA.app.toast(input.checked ? "Weekly quizzes on" : "Opted out"); }); });
      card.appendChild(row("📅 Weekly quizzes", "Get a fresh mixed quiz each week", el("label", { class: "switch" }, [input, el("span", { class: "switch__track" })])));
    });

    var card = el("div", { class: "card" });
    wrap.appendChild(card);

    // streak + progress
    Promise.all([MA.store.getKV("streak", { count: 0 }), MA.store.all("notes"), MA.store.all("events")]).then(function (r) {
      var streak = r[0];
      var stats = el("div", { class: "grid2", style: "margin-top:4px" }, [
        stat("🔥", streak.count || 0, "day streak"),
        stat("📝", r[1].length, "notes"),

        stat("🃏", ((window.MA_DATA && MA_DATA.decks) || []).reduce(function (a, d) { return a + d.cards.length; }, 0), "flashcards")
      ]);
      wrap.insertBefore(el("div", {}, [el("div", { class: "section-title", text: "Your progress" }), stats]), wrap.firstChild);
    });

    // appearance controls
    wrap.appendChild(el("div", { class: "section-title", text: "Appearance" }));
    wrap.appendChild(buildAppearance());

    // character (Task 2: re-selectable any time, no first-run restriction)
    wrap.appendChild(el("div", { class: "section-title", text: "Character" }));
    var charCard = el("div", { class: "card stack" });
    wrap.appendChild(charCard);
    renderCharCard();
    function onCharChange() { renderCharCard(); }
    window.addEventListener("ma:character", onCharChange);
    MA.app.onLeave(function () { window.removeEventListener("ma:character", onCharChange); });
    function renderCharCard() {
      charCard.innerHTML = "";
      var id = MA.characters ? MA.characters.getCharacter() : null;
      var def = id && MA.characters ? MA.characters.list().filter(function (c) { return c.id === id; })[0] : null;
      charCard.appendChild(def
        ? row(def.emoji + " " + def.name, def.bonus, null)
        : el("p", { class: "muted", text: "No character selected yet." }));
      charCard.appendChild(el("button", {
        class: "btn btn--primary btn--block", style: "margin-top:8px",
        onclick: function () { if (MA.characters) MA.characters.openChooser({ firstRun: false }); }
      }, def ? "Switch character" : "Choose a character"));
    }

    // data controls
    wrap.appendChild(el("div", { class: "section-title", text: "Your data" }));
    var data = el("div", { class: "card stack" });
    data.appendChild(el("p", { class: "muted", text: "Everything you create stays on this device. Back it up or clear it here." }));
    data.appendChild(el("button", { class: "btn btn--ghost btn--block", onclick: exportAll }, "⤓ Back up all my data (.json)"));
    data.appendChild(el("button", { class: "btn btn--danger btn--block", onclick: clearAll }, "Clear all my data"));
    wrap.appendChild(data);

    // about
    wrap.appendChild(el("div", { class: "section-title", text: "About" }));
    wrap.appendChild(el("div", { class: "card" }, [
      el("p", { html: "<strong>MA Study</strong> v" + ((window.MA_DATA && MA_DATA.meta && MA_DATA.meta.version) || "1.0.0") }),
      el("p", { class: "muted", text: "Offline study app for Medical Assistants, with a BSN/TEAS pathway. Educational use only — verify clinical details against current authoritative sources." }),
      el("p", { class: "muted", text: "Install: open in your phone browser → Share/Menu → “Add to Home Screen” to use fully offline." })
    ]));

    function row(title, sub, control) {
      return el("div", { class: "row row--between", style: "padding:6px 0" }, [
        el("div", {}, [el("div", { class: "list__title", text: title }), el("div", { class: "list__sub", text: sub })]), control
      ]);
    }

    function readAppearance() { try { return JSON.parse(localStorage.getItem("ma.appearance") || "{}"); } catch (e) { return {}; } }
    function writeAppearance(patch) {
      var a = readAppearance(); for (var k in patch) a[k] = patch[k];
      localStorage.setItem("ma.appearance", JSON.stringify(a));
      var r = document.documentElement;
      if (a.theme) r.setAttribute("data-theme", a.theme);
      if (a.mode) r.setAttribute("data-mode", a.mode); else r.removeAttribute("data-mode");
      return a;
    }
    function buildAppearance() {
      var a = readAppearance();
      var card = el("div", { class: "card stack" });

      // name
      var nameInput = el("input", { class: "input", type: "text", placeholder: "Your name", "aria-label": "Your name", style: "width:100%" });
      nameInput.value = a.name || "Jenny";
      nameInput.addEventListener("input", function () { writeAppearance({ name: nameInput.value.trim() || "Jenny" }); });
      card.appendChild(el("div", {}, [el("div", { class: "list__sub", style: "margin-bottom:6px", text: "Greeting name" }), nameInput]));

      // light / dark
      var modes = [["dark", "☾ Dark"], ["light", "☀︎ Light"]];
      var seg = el("div", { class: "seg", role: "group", "aria-label": "Theme mode" });
      var curMode = (a.mode === "light" ? "light" : "dark");
      modes.forEach(function (m) {
        var b = el("button", { type: "button", text: m[1] });
        b.setAttribute("aria-pressed", String(curMode === m[0]));
        b.addEventListener("click", function () {
          writeAppearance({ mode: m[0] });
          seg.querySelectorAll("button").forEach(function (x) { x.setAttribute("aria-pressed", "false"); });
          b.setAttribute("aria-pressed", "true");
        });
        seg.appendChild(b);
      });
      card.appendChild(el("div", {}, [el("div", { class: "list__sub", style: "margin-bottom:8px", text: "Mode" }), seg]));

      // palette swatches
      var palettes = [
        ["aurora", "Aurora", "#B6A6F7", "#8FE6CE"],
        ["lavender", "Lavender", "#CBAAFF", "#E7ABF2"],
        ["mint", "Mint", "#7FE3C2", "#BCE89B"],
        ["peach", "Peach", "#FFB59B", "#FFD79A"],
        ["rose", "Rose", "#FF9DB7", "#FFC2A0"],
        ["ocean", "Ocean", "#85C9F2", "#8FE6CE"]
      ];
      var sw = el("div", { class: "swatches" });
      var curTheme = a.theme || "aurora";
      palettes.forEach(function (p) {
        var b = el("button", { type: "button", class: "swatch", title: p[1], "aria-label": p[1], style: "background:linear-gradient(135deg," + p[2] + "," + p[3] + ")" });
        b.setAttribute("aria-pressed", String(curTheme === p[0]));
        b.addEventListener("click", function () {
          writeAppearance({ theme: p[0] });
          sw.querySelectorAll(".swatch").forEach(function (x) { x.setAttribute("aria-pressed", "false"); });
          b.setAttribute("aria-pressed", "true");
          if (MA.celebrate) MA.celebrate({ count: 60, y: innerHeight * 0.5 });
        });
        sw.appendChild(b);
      });
      card.appendChild(el("div", {}, [el("div", { class: "list__sub", style: "margin-bottom:8px", text: "Color theme" }), sw]));

      return card;
    }
    function stat(emoji, n, label) {
      return el("div", { class: "card", style: "text-align:center;padding:14px" }, [
        el("div", { style: "font-size:24px", text: emoji }), el("div", { style: "font-size:22px;font-weight:800", text: String(n) }), el("div", { class: "muted", text: label })
      ]);
    }
    function exportAll() {
      Promise.all([MA.store.all("notes"), MA.store.all("folders"), MA.store.all("events"), MA.store.all("kv")]).then(function (r) {
        var dump = { app: "ma-study", exported: new Date().toISOString(), notes: r[0], folders: r[1], events: r[2], kv: r[3] };
        U.download("ma-study-backup.json", JSON.stringify(dump, null, 2), "application/json"); MA.app.toast("Backup downloaded");
      });
    }
    function clearAll() {
      var box = el("div", { class: "stack" }, [
        el("h3", { text: "Clear all data?" }),
        el("p", { class: "muted", text: "This permanently deletes your notes, folders, events, streak, and study progress on this device. This can't be undone." }),
        el("button", { class: "btn btn--danger btn--block", onclick: function () {
          Promise.all(["notes", "folders", "events", "kv"].map(function (s) { return MA.store.all(s).then(function (items) { return Promise.all(items.map(function (it) { return MA.store.del(s, it.id); })); }); }))
            .then(function () { MA.app.closeSheet(); MA.app.toast("All data cleared"); MA.app.go("home"); });
        } }, "Yes, delete everything"),
        el("button", { class: "btn btn--ghost btn--block", onclick: function () { MA.app.closeSheet(); } }, "Cancel")
      ]);
      MA.app.openSheet(box);
    }
    return wrap;
  }

  MA.settings = { title: "Settings", render: render };
})();

<script>
/* ---- js/app.js ---- */
/* app.js — shell, hash router, home dashboard, and shared services
   (toast, bottom sheet, streak, view lifecycle). */
(function () {
  "use strict";
  var MA = window.MA, U = MA.util, el = U.el;
  var viewEl = document.getElementById("view");
  var titleEl = document.getElementById("appTitle");
  var backBtn = document.getElementById("navBack");
  var sheet = document.getElementById("sheet");
  var sheetBody = document.getElementById("sheetBody");
  var toastEl = document.getElementById("toast");
  var leaveHandlers = [];

  /* ---------- view lifecycle ---------- */
  function runLeave() { leaveHandlers.forEach(function (f) { try { f(); } catch (e) {} }); leaveHandlers = []; }
  function onLeave(fn) { leaveHandlers.push(fn); }
  function setView(node, title) {
    viewEl.innerHTML = "";
    viewEl.appendChild(node);
    viewEl.scrollTop = 0;
    if (title) titleEl.textContent = title;
    viewEl.focus({ preventScroll: true });
  }

  /* ---------- toast ---------- */
  var toastT;
  function toast(msg) { toastEl.textContent = msg; toastEl.hidden = false; clearTimeout(toastT); toastT = setTimeout(function () { toastEl.hidden = true; }, 1800); }

  /* ---------- bottom sheet ---------- */
  function openSheet(node) { sheetBody.innerHTML = ""; sheetBody.appendChild(node); sheet.hidden = false; }
  function closeSheet() { sheet.hidden = true; sheetBody.innerHTML = ""; }
  sheet.addEventListener("click", function (e) { if (e.target.hasAttribute("data-close-sheet")) closeSheet(); });

  /* ---------- streak ---------- */
  function todayStr() { return new Date().toISOString().slice(0, 10); }
  function bumpStreak() {
    return MA.store.getKV("streak", { count: 0, last: null }).then(function (s) {
      var t = todayStr();
      // log study activity for the weekly chart (counts every completed session)
      MA.store.getKV("activityLog", {}).then(function (log) { log = log || {}; log[t] = (log[t] || 0) + 1; MA.store.setKV("activityLog", log); });
      if (s.last === t) return s;
      var y = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
      s.count = s.last === y ? (s.count || 0) + 1 : 1;
      s.last = t;
      return MA.store.setKV("streak", s).then(function () { return s; });
    });
  }

  /* ---------- router ---------- */
  var TABS = { home: 1, study: 1, anatomy: 1, notes: 1 };
  function go(route) { var target = "#/" + route; if (location.hash === target) handle(); else location.hash = target; }
  window.addEventListener("hashchange", handle);

  function handle() {
    var path = (location.hash || "#/home").replace(/^#\/?/, "");
    var seg = path.split("/").filter(Boolean);
    var base = seg[0] || "home";

    // "More" just opens the menu over the current view — don't tear the view down.
    if (base === "more") { openMore(); highlightTab(TABS[currentBase] ? currentBase : ""); return; }

    runLeave();
    closeSheet();
    var node, title, showBack = false;
    try {
      switch (base) {
        case "home": node = renderHome(); title = "MA Study"; break;
        case "study":
          if (seg[2]) { node = MA.flashcards.routes[seg[2]](seg[1]); title = "Study"; showBack = true; }
          else if (seg[1]) { node = MA.flashcards.routes.deck(seg[1]); title = "Study"; showBack = true; }
          else { node = MA.flashcards.renderList(); title = "Study"; }
          break;
        case "anatomy": node = MA.viewer3d.render(seg[1], seg[2]); title = "Anatomy 3D"; break;
        case "notes": node = MA.notes.render(); title = "Notes"; break;
        case "quiz":
          node = seg[1] ? MA.quiz.renderBank(seg[1]) : MA.quiz.renderHub(); title = "Quizzes"; showBack = !!seg[1] || true; break;
        case "calendar": node = MA.calendar.render(); title = "Calendar"; showBack = true; break;
        case "facts": node = MA.facts.render(); title = "Fun Facts"; showBack = true; break;
        case "library": node = MA.library.render(seg.slice(1).join("/")); title = "Library"; showBack = true; break;
        case "shop": node = MA.shop.render(); title = "Shop"; showBack = true; break;
        case "settings": node = MA.settings.render(); title = "Settings"; showBack = true; break;
        default: node = renderHome(); title = "MA Study"; base = "home";
      }
    } catch (err) {
      node = el("div", { class: "empty" }, [el("div", { class: "empty__emoji", text: "⚠️" }), el("h3", { text: "Something went wrong" }), el("p", { class: "muted", text: String(err && err.message || err) })]);
    }
    // deeper study/library routes also get back
    if (seg.length > 1) showBack = true;

    currentBase = base;
    setView(node, title);
    backBtn.hidden = !showBack;
    backBtn.onclick = function () { history.length > 1 ? history.back() : go(base); };
    highlightTab(TABS[base] ? base : "");
  }
  var currentBase = "home";

  function highlightTab(base) {
    Array.prototype.forEach.call(document.querySelectorAll(".tabbar__btn"), function (b) {
      var on = b.dataset.route === base;
      if (on) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
    });
  }

  document.querySelector(".tabbar").addEventListener("click", function (e) {
    var btn = e.target.closest(".tabbar__btn"); if (!btn) return;
    var r = btn.dataset.route;
    if (r === "more") openMore(); else go(r);
  });
  document.getElementById("navSettings").addEventListener("click", function () { go("settings"); });

  /* ---------- "More" menu ---------- */
  function openMore() {
    var items = [
      { r: "shop", e: "🛍️", n: "Shop", s: "Spend your Study Coins" },

  /* ---------- home dashboard ---------- */
  function renderHome() {
    var wrap = el("div", { class: "stack" });

    var who = (function () { try { return JSON.parse(localStorage.getItem("ma.appearance") || "{}").name || "Jenny"; } catch (e) { return "Jenny"; } })();

    var hero = el("div", { class: "hero stack" }, [

        ]),

      ]),

        el("div", { class: "hero-stat", id: "heroStatDue" }, [el("span", { class: "hero-stat__icon", text: "⚡" }), el("span", { text: "Cards due" })])
      ]),

      })()

    wrap.appendChild(hero);
    MA.store.getKV("streak", { count: 0 }).then(function (s) { var n = document.getElementById("homeStreak"); if (n) n.textContent = "🔥 " + (s.count || 0); });

    // ---- progress diagrams (computed from Leitner SRS state) ----
    var progSlot = el("div");
    wrap.appendChild(progSlot);
    (function buildProgress() {
      var decks = (window.MA_DATA && MA_DATA.decks) || [];
      if (!decks.length) return;
      var BOX_DAYS = [0, 1, 2, 4, 7, 15];
      function isDue(rec) { return !rec || !rec.due || rec.due <= Date.now(); }
      Promise.all(decks.map(function (d) {
        return MA.store.getKV("srs:" + d.id, {}).then(function (map) { return { deck: d, map: map || {} }; });
      })).then(function (rows) {
        var boxes = [0, 0, 0, 0, 0, 0]; // index 0 = new/unseen, 1..5 = Leitner box
        var total = 0, dueNow = 0;
        var deckStats = [];
        rows.forEach(function (r) {
          var dLearned = 0, dTotal = r.deck.cards.length;
          r.deck.cards.forEach(function (c) {
            total++;
            var rec = r.map[c.id];
            var b = rec && rec.box ? Math.max(1, Math.min(5, rec.box)) : 0;
            boxes[b]++;
            if (b >= 1) dLearned++;
            if (isDue(rec) && rec) dueNow++;
            else if (!rec) dueNow++;
          });
          deckStats.push({ title: r.deck.title, learned: dLearned, total: dTotal, pct: dTotal ? Math.round((dLearned / dTotal) * 100) : 0 });
        });
        var newCount = boxes[0];
        var learning = boxes[1] + boxes[2] + boxes[3];
        var mastered = boxes[4] + boxes[5];
        var seen = learning + mastered;
        var pctLearned = total ? Math.round((seen / total) * 100) : 0;

        // ---- warm zero-state for a brand-new install ----
        if (seen === 0) {
          var welcome = el("div", { class: "progress-card" });
          welcome.innerHTML =
            '<div class="welcome">' +
              '<div class="welcome__emoji">💜</div>' +
              '<div class="welcome__title">Let\u2019s begin, ' + (who || "Jenny") + '</div>' +
              '<div class="welcome__sub">' + total + ' cards across ' + decks.length + ' decks are ready. Finish your first study session and your progress rings &amp; charts come to life here.</div>' +
              '<div class="welcome__chips"></div>' +
            '</div>';
          var chips = welcome.querySelector(".welcome__chips");
          decks.slice(0, 4).forEach(function (d) { var c = el("span", { class: "welcome__chip", text: d.title }); chips.appendChild(c); });
          var cta = el("button", { class: "btn btn--primary btn--block", style: "margin-top:14px", onclick: function () { go("study"); } }, "Start studying →");
          welcome.appendChild(cta);
          progSlot.appendChild(welcome);
          return;
        }

        var C = { newc: "var(--muted-fg)", learning: "var(--warm)", mastered: "var(--success)" };
        var boxColors = ["var(--muted-2)", "color-mix(in srgb, var(--warm) 70%, var(--card))", "var(--warm)", "var(--secondary)", "var(--primary)", "var(--success)"];
        var boxNames = ["New", "Box 1", "Box 2", "Box 3", "Box 4", "Mastered"];

        var R = 52, CIRC = 2 * Math.PI * R;
        var offset = CIRC * (1 - pctLearned / 100);

        var card = el("div", { class: "progress-card" });
        var html = '' +
          '<div class="section-title" style="margin-top:0">Your progress</div>' +
          '<div class="prog-top">' +
            '<div class="ring-wrap">' +
              '<svg width="116" height="116" viewBox="0 0 116 116">' +
                '<defs><linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">' +
                  '<stop offset="0" stop-color="var(--primary)"/><stop offset="1" stop-color="var(--success)"/>' +
                '</linearGradient></defs>' +
                '<circle class="ring-bg" cx="58" cy="58" r="' + R + '" stroke-width="12"/>' +
                '<circle class="ring-fg" cx="58" cy="58" r="' + R + '" stroke-width="12" ' +
                  'stroke-dasharray="' + CIRC.toFixed(1) + '" stroke-dashoffset="' + offset.toFixed(1) + '" style="--circ:' + CIRC.toFixed(1) + '"/>' +
              '</svg>' +
              '<div class="ring-label"><span class="ring-pct">' + pctLearned + '%</span><span class="ring-cap">Learned</span></div>' +
            '</div>' +
            '<div class="prog-legend">' +
              '<div class="legend-row"><span class="legend-dot" style="background:' + C.mastered + '"></span><span class="legend-n">' + mastered + '</span><span class="legend-l">mastered</span></div>' +
              '<div class="legend-row"><span class="legend-dot" style="background:' + C.learning + '"></span><span class="legend-n">' + learning + '</span><span class="legend-l">learning</span></div>' +
              '<div class="legend-row"><span class="legend-dot" style="background:' + C.newc + '"></span><span class="legend-n">' + newCount + '</span><span class="legend-l">new · ' + dueNow + ' due</span></div>' +
            '</div>' +
          '</div>';

        // leitner distribution bar
        html += '<div class="leitner"><div class="leitner__track">';
        for (var b = 0; b <= 5; b++) {
          var grow = boxes[b];
          html += '<div class="leitner__seg" style="flex-grow:' + grow + ';background:' + boxColors[b] + '"></div>';
        }
        html += '</div><div class="leitner__keys">';
        for (var k = 0; k <= 5; k++) {
          html += '<span class="leitner__key"><i style="background:' + boxColors[k] + '"></i>' + boxNames[k] + ' ' + boxes[k] + '</span>';
        }
        html += '</div></div>';
        card.innerHTML = html;

        // per-deck bars (top 5 by activity, then by size)
        var topDecks = deckStats.slice().sort(function (a, b) { return (b.learned - a.learned) || (b.total - a.total); }).slice(0, 5);
        var bars = el("div", { class: "deckbars", style: "margin-top:16px" });
        bars.appendChild(el("div", { class: "section-title", style: "margin:0 0 2px" }, "By deck"));
        topDecks.forEach(function (ds) {
          var row = el("div");
          row.innerHTML = '<div class="deckbar__top"><span class="deckbar__name">' + ds.title + '</span><span class="deckbar__pct">' + ds.learned + '/' + ds.total + ' · ' + ds.pct + '%</span></div>' +
            '<div class="deckbar__track"><div class="deckbar__fill" style="--w:' + ds.pct + '%"></div></div>';
          bars.appendChild(row);
        });
        card.appendChild(bars);

        progSlot.appendChild(el("div", {}, [card]));

        // weekly activity chart
        MA.store.getKV("activityLog", {}).then(function (logRaw) {
          var log = logRaw || {};
          var days = ["S", "M", "T", "W", "T", "F", "S"];
          var todayStr = new Date().toISOString().slice(0, 10);
          var cols = [];
          var max = 1;
          for (var i = 6; i >= 0; i--) {
            var dt = new Date(); dt.setDate(dt.getDate() - i);
            var key = dt.toISOString().slice(0, 10);
            var v = log[key] || 0; if (v > max) max = v;
            cols.push({ key: key, v: v, lbl: days[dt.getDay()], today: key === todayStr });
          }
          var wk = el("div", { class: "card", style: "margin-top:var(--sp-3)" });
          var wkHtml = '<div class="section-title" style="margin-top:0">This week</div><div class="week">';
          cols.forEach(function (c) {
            var h = Math.max(6, Math.round((c.v / max) * 100));
            var cls = c.today ? "is-today" : (c.v === 0 ? "is-empty" : "");
            wkHtml += '<div class="week__col ' + (c.today ? "is-today" : "") + '">' +
              '<div class="week__bar ' + cls + '" style="--h:' + h + '%"></div>' +
              '<span class="week__lbl">' + c.lbl + '</span></div>';
          });
          wkHtml += '</div>';
          wk.innerHTML = wkHtml;
          progSlot.appendChild(wk);
        });
      });
    })();

    // weekly quiz prompt
    MA.store.getKV("weeklyOptIn", false).then(function (on) {
      if (!on) return;
      MA.store.getKV("weeklyDone", {}).then(function (done) {
        var wk = U.weekKey();
        if (done[wk]) return;
        var c = el("div", { class: "card row row--between" }, [
          el("div", {}, [el("div", { class: "list__title", text: "📅 Weekly quiz is ready" }), el("div", { class: "list__sub", text: "10 mixed questions" })]),
          el("button", { class: "btn btn--primary btn--sm", onclick: function () { go("quiz"); } }, "Start")
        ]);
        wrap.insertBefore(c, wrap.children[1] || null);
      });
    });

    // upcoming exam
    MA.store.all("events").then(function (events) {
      var up = events.filter(function (e) { return new Date(e.date).setHours(0, 0, 0, 0) >= new Date().setHours(0, 0, 0, 0); }).sort(function (a, b) { return a.date - b.date; })[0];
      if (!up) return;
      var d = U.daysUntil(up.date);
      var c = el("button", { class: "list__item card", style: "width:100%;border-radius:var(--r)", onclick: function () { go("calendar"); } }, [
        el("span", { class: "tile__emoji", text: "⏳" }),
        el("div", { class: "list__grow" }, [el("div", { class: "list__title ellipsis", text: up.title }), el("div", { class: "list__sub", text: U.fmtDate(up.date, { weekday: "short", month: "short", day: "numeric" }) })]),
        el("span", { class: "pill pill--accent", text: d === 0 ? "Today" : d + "d" })
      ]);
      wrap.appendChild(el("div", {}, [el("div", { class: "section-title", text: "Next up" }), c]));
    });

    // quick tiles
    wrap.appendChild(el("div", { class: "section-title", text: "Jump in" }));
    var tiles = el("div", { class: "tiles" });
    [
      { r: "study", e: "🃏", n: "Flashcards", s: "Quizlet-style decks" },
      { r: "anatomy", e: "🫀", n: "3D Anatomy", s: "Interactive models" },
      { r: "quiz", e: "❓", n: "Quizzes", s: "Test yourself" },
      { r: "notes", e: "📓", n: "Notes", s: "Folders + .md export" },
      { r: "calendar", e: "🗓️", n: "Calendar", s: "Plan your exams" },
      { r: "library", e: "📚", n: "BSN / TEAS", s: "Pathway & docs" },
      { r: "facts", e: "💡", n: "Fun Facts", s: "Quick knowledge" },
      { r: "settings", e: "⚙️", n: "Settings", s: "You & your data" }
    ].forEach(function (t) {
      tiles.appendChild(el("button", { class: "tile", onclick: function () { go(t.r); } }, [
        el("span", { class: "tile__emoji", text: t.e }), el("span", { class: "tile__name", text: t.n }), el("span", { class: "tile__sub", text: t.s })
      ]));
    });
    wrap.appendChild(tiles);

    // fact of the day
    var facts = (MA_DATA && MA_DATA.facts) || [];
    if (facts.length) {
      var f = facts[Math.floor(Date.now() / 86400000) % facts.length];
      wrap.appendChild(el("div", {}, [
        el("div", { class: "section-title", text: "Fact of the day" }),
        el("button", { class: "card", style: "width:100%;text-align:left", onclick: function () { go("facts"); } }, [el("div", { class: "fact", text: "💡 " + f.text }), el("div", { class: "fact__src", text: f.source })])
      ]));
    }
    return wrap;
  }

  MA.app = { go: go, setView: setView, onLeave: onLeave, toast: toast, openSheet: openSheet, closeSheet: closeSheet, bumpStreak: bumpStreak };

  /* ---------- boot ---------- */
  if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
    window.addEventListener("load", function () { navigator.serviceWorker.register("service-worker.js").catch(function () {}); });
  }
  handle();
})();

</script>

<!-- ============================================================
     Celebration engine — confetti + haptic on completion screens
     ============================================================ -->
<canvas id="fx"></canvas>
<script>
(function () {
  var canvas = document.getElementById("fx");
  var ctx = canvas.getContext("2d");
  var DPR = Math.min(2, window.devicePixelRatio || 1);
  var parts = [], raf = null, last = 0;
  function size() { canvas.width = innerWidth * DPR; canvas.height = innerHeight * DPR; canvas.style.width = innerWidth + "px"; canvas.style.height = innerHeight + "px"; }
  size(); addEventListener("resize", size);

  function palette() {
    var cs = getComputedStyle(document.documentElement);
    return ["--primary", "--success", "--secondary", "--warm", "--primary-600"].map(function (v) { return cs.getPropertyValue(v).trim() || "#B6A6F7"; });
  }
  function burst(opts) {
    opts = opts || {};
    var colors = palette();
    var n = opts.count || 130;
    var cx = (opts.x != null ? opts.x : innerWidth / 2) * DPR;
    var cy = (opts.y != null ? opts.y : innerHeight * 0.36) * DPR;
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2;
      var sp = (Math.random() * 9 + 4) * DPR;
      parts.push({
        x: cx, y: cy,
        vx: Math.cos(a) * sp * (0.6 + Math.random() * 0.8),
        vy: Math.sin(a) * sp - (Math.random() * 6 + 4) * DPR,
        g: (0.28 + Math.random() * 0.12) * DPR,
        size: (Math.random() * 7 + 4) * DPR,
        rot: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.4,
        color: colors[(Math.random() * colors.length) | 0],
        shape: Math.random() < 0.32 ? "circle" : "rect",
        life: 0, ttl: 90 + Math.random() * 50
      });
    }
    if (!raf) { last = performance.now(); raf = requestAnimationFrame(tick); }
    if (navigator.vibrate) { try { navigator.vibrate([8, 40, 12]); } catch (e) {} }
  }
  function tick(now) {
    var dt = Math.min(2.5, (now - last) / 16.67); last = now;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (var i = parts.length - 1; i >= 0; i--) {
      var p = parts[i];
      p.life += dt;
      p.vy += p.g * dt; p.vx *= 0.992;
      p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
      var alpha = p.life > p.ttl * 0.7 ? Math.max(0, 1 - (p.life - p.ttl * 0.7) / (p.ttl * 0.3)) : 1;
      ctx.globalAlpha = alpha; ctx.fillStyle = p.color;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      if (p.shape === "circle") { ctx.beginPath(); ctx.arc(0, 0, p.size / 2, 0, 7); ctx.fill(); }
      else { ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6); }
      ctx.restore();
      if (p.life >= p.ttl || p.y > canvas.height + 40) parts.splice(i, 1);
    }
    ctx.globalAlpha = 1;
    if (parts.length) { raf = requestAnimationFrame(tick); } else { raf = null; ctx.clearRect(0, 0, canvas.width, canvas.height); }
  }

  var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  function celebrate(opts) { if (reduce) return; burst(opts); }
  if (window.MA) MA.celebrate = celebrate; else window.MA = { celebrate: celebrate };

  // Auto-fire when a completion/celebration screen appears (catches learn, test, quiz, match)
  var lastFire = 0;
  function maybeCelebrate(node) {
    if (!node || node.nodeType !== 1) return;
    var hit = node.matches && (node.matches(".empty__emoji") || node.matches(".scorecard, .quiz-done, .match-done"));
    var txt = (node.textContent || "");
    var celebratory = /🎉|🏆|⚡|Great|Perfect|All done|Complete|You did it/i;
    var emoji = node.querySelector && node.querySelector(".empty__emoji");
    if (hit || (emoji && celebratory.test(emoji.textContent)) || (node.classList && node.classList.contains("empty") && celebratory.test(txt))) {
      var now = Date.now();
      if (now - lastFire < 700) return; lastFire = now;
      var strong = /🏆|Perfect|100/i.test(txt);
      setTimeout(function () {
        celebrate({ count: strong ? 200 : 130 });
        if (strong) { setTimeout(function () { celebrate({ count: 110, x: innerWidth * 0.28 }); }, 220); setTimeout(function () { celebrate({ count: 110, x: innerWidth * 0.72 }); }, 380); }
      }, 120);
    }
  }
  var mo = new MutationObserver(function (muts) {
    muts.forEach(function (m) { for (var i = 0; i < m.addedNodes.length; i++) maybeCelebrate(m.addedNodes[i]); });
  });
  var viewEl = document.getElementById("view");
  if (viewEl) mo.observe(viewEl, { childList: true, subtree: true });
})();
</script>
