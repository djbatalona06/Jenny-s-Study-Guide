/* ============================================================
   MA Study — design system
   Palette: Healthcare (calm cyan + health green) · WCAG-AAA minded
   ============================================================ */
:root {
  /* brand */
  --primary: #0891B2;
  --primary-600: #0E7490;
  --primary-700: #155E75;
  --on-primary: #FFFFFF;
  --secondary: #22D3EE;
  --accent: #059669;
  --on-accent: #FFFFFF;
  --destructive: #DC2626;
  --warn: #D97706;

  /* surfaces (light) */
  --bg: #ECFEFF;
  --bg-grad: radial-gradient(1200px 600px at 70% -10%, #CFFAFE 0%, #ECFEFF 55%, #F0FDFA 100%);
  --card: #FFFFFF;
  --card-2: #F7FCFD;
  --fg: #0F2E36;
  --fg-soft: #164E63;
  --muted: #E8F1F6;
  --muted-fg: #587082;
  --border: #C7E9F1;
  --ring: #0891B2;

  /* type scale */
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
  --fs-xs: 12px; --fs-sm: 14px; --fs-base: 16px; --fs-lg: 18px;
  --fs-xl: 22px; --fs-2xl: 28px; --fs-3xl: 34px;

  /* spacing / radius / shadow */
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 24px; --sp-6: 32px;
  --r-sm: 10px; --r: 16px; --r-lg: 22px; --r-full: 999px;
  --shadow: 0 1px 2px rgba(8,55,66,.06), 0 8px 24px rgba(8,55,66,.08);
  --shadow-lg: 0 12px 40px rgba(8,55,66,.16);
  --touch: 44px;
  --tab-h: 64px; --bar-h: 56px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #06141A;
    --bg-grad: radial-gradient(1200px 600px at 70% -10%, #0B2A33 0%, #06141A 60%);
    --card: #0E2229;
    --card-2: #102A33;
    --fg: #E6F6FA;
    --fg-soft: #BFE7F0;
    --muted: #14303A;
    --muted-fg: #8FB6C2;
    --border: #1C3D49;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    --shadow-lg: 0 12px 40px rgba(0,0,0,.5);
  }
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--font);
  font-size: var(--fs-base);
  line-height: 1.5;
  color: var(--fg);
  background: var(--bg);
  background-image: var(--bg-grad);
  background-attachment: fixed;
  -webkit-text-size-adjust: 100%;
  overscroll-behavior-y: none;
}
h1, h2, h3 { line-height: 1.2; margin: 0 0 var(--sp-2); color: var(--fg); }
p { margin: 0 0 var(--sp-3); }
a { color: var(--primary-600); }
img { max-width: 100%; }

/* accessibility */
.skip-link {
  position: absolute; left: -9999px; top: 0; z-index: 100;
  background: var(--primary); color: #fff; padding: 10px 14px; border-radius: 0 0 var(--r-sm) 0;
}
.skip-link:focus { left: 0; }
:focus-visible { outline: 3px solid var(--ring); outline-offset: 2px; border-radius: 6px; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}

/* ---------- layout shell ---------- */
#app { display: flex; flex-direction: column; min-height: 100dvh; }
.appbar {
  position: sticky; top: 0; z-index: 20;
  height: var(--bar-h); display: flex; align-items: center; gap: var(--sp-2);
  padding: 0 var(--sp-3); padding-top: env(safe-area-inset-top);
  background: color-mix(in srgb, var(--card) 86%, transparent);
  backdrop-filter: saturate(1.4) blur(12px);
  border-bottom: 1px solid var(--border);
}
.appbar__title { font-size: var(--fs-lg); font-weight: 700; flex: 1; }
.appbar__back, .appbar__action {
  min-width: var(--touch); min-height: var(--touch);
  border: 0; background: transparent; color: var(--fg);
  font-size: 22px; border-radius: var(--r-full); cursor: pointer;
}
.appbar__back { font-size: 30px; line-height: 1; }
.appbar__action:active, .appbar__back:active { background: var(--muted); }

.view {
  flex: 1; padding: var(--sp-4);
  padding-bottom: calc(var(--tab-h) + env(safe-area-inset-bottom) + 16px);
  max-width: 760px; width: 100%; margin: 0 auto;
}

/* ---------- bottom tabs ---------- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  height: calc(var(--tab-h) + env(safe-area-inset-bottom));
  padding-bottom: env(safe-area-inset-bottom);
  display: grid; grid-template-columns: repeat(5, 1fr);
  background: color-mix(in srgb, var(--card) 92%, transparent);
  backdrop-filter: saturate(1.4) blur(14px);
  border-top: 1px solid var(--border);
}
.tabbar__btn {
  border: 0; background: transparent; cursor: pointer; color: var(--muted-fg);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  font-size: var(--fs-xs); min-height: var(--touch);
}
.tabbar__icon { font-size: 22px; line-height: 1; }
.tabbar__btn[aria-current="page"] { color: var(--primary); font-weight: 700; }
.tabbar__btn[aria-current="page"] .tabbar__icon { transform: translateY(-1px) scale(1.08); }

/* ---------- cards / primitives ---------- */
.card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--r); padding: var(--sp-4); box-shadow: var(--shadow);
}
.card + .card { margin-top: var(--sp-3); }
.stack > * + * { margin-top: var(--sp-3); }
.row { display: flex; align-items: center; gap: var(--sp-3); }
.row--between { justify-content: space-between; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-3); }
.muted { color: var(--muted-fg); }
.center { text-align: center; }
.pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px; border-radius: var(--r-full);
  background: var(--muted); color: var(--fg-soft); font-size: var(--fs-xs); font-weight: 600;
}
.pill--accent { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
.pill--primary { background: color-mix(in srgb, var(--primary) 16%, transparent); color: var(--primary-700); }

.section-title { font-size: var(--fs-sm); text-transform: uppercase; letter-spacing: .06em; color: var(--muted-fg); margin: var(--sp-5) 0 var(--sp-2); font-weight: 700; }

/* buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: var(--touch); padding: 0 18px; border-radius: var(--r-full);
  border: 1px solid transparent; font-size: var(--fs-base); font-weight: 700;
  cursor: pointer; background: var(--muted); color: var(--fg); transition: transform .08s ease;
}
.btn:active { transform: scale(.97); }
.btn--primary { background: var(--primary); color: var(--on-primary); }
.btn--accent { background: var(--accent); color: var(--on-accent); }
.btn--ghost { background: transparent; border-color: var(--border); }
.btn--danger { background: transparent; color: var(--destructive); border-color: color-mix(in srgb, var(--destructive) 40%, transparent); }
.btn--block { width: 100%; }
.btn--sm { min-height: 36px; font-size: var(--fs-sm); padding: 0 12px; }

/* inputs */
.input, .textarea, select {
  width: 100%; min-height: var(--touch); padding: 10px 14px;
  border: 1px solid var(--border); border-radius: var(--r-sm);
  background: var(--card-2); color: var(--fg); font: inherit;
}
.textarea { min-height: 140px; resize: vertical; line-height: 1.6; }
label { font-size: var(--fs-sm); font-weight: 600; color: var(--fg-soft); display: block; margin-bottom: 6px; }
.field + .field { margin-top: var(--sp-3); }

/* toggle */
.switch { position: relative; width: 52px; height: 30px; flex: none; }
.switch input { opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.switch__track { position: absolute; inset: 0; background: var(--muted); border-radius: var(--r-full); transition: background .15s; }
.switch__track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; background: #fff; border-radius: 50%; box-shadow: var(--shadow); transition: transform .15s; }
.switch input:checked + .switch__track { background: var(--accent); }
.switch input:checked + .switch__track::after { transform: translateX(22px); }

/* progress */
.bar { height: 8px; background: var(--muted); border-radius: var(--r-full); overflow: hidden; }
.bar__fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--accent)); border-radius: inherit; transition: width .3s; }

/* hero */
.hero {
  border-radius: var(--r-lg); padding: var(--sp-5);
  color: #fff; background: linear-gradient(135deg, var(--primary-700), var(--primary) 60%, var(--accent));
  box-shadow: var(--shadow-lg);
}
.hero h2 { color: #fff; font-size: var(--fs-2xl); }
.hero .muted { color: rgba(255,255,255,.85); }

/* tiles grid (home) */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-3); }
.tile {
  display: flex; flex-direction: column; gap: 6px; text-align: left;
  background: var(--card); border: 1px solid var(--border); border-radius: var(--r);
  padding: var(--sp-4); cursor: pointer; box-shadow: var(--shadow); min-height: 96px;
}
.tile:active { transform: scale(.98); }
.tile__emoji { font-size: 26px; }
.tile__name { font-weight: 700; }
.tile__sub { font-size: var(--fs-xs); color: var(--muted-fg); }

/* list rows */
.list { border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; background: var(--card); }
.list__item { display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-3) var(--sp-4); width: 100%; border: 0; background: transparent; color: var(--fg); cursor: pointer; text-align: left; min-height: 56px; border-bottom: 1px solid var(--border); }
.list__item:last-child { border-bottom: 0; }
.list__item:active { background: var(--card-2); }
.list__grow { flex: 1; min-width: 0; }
.list__title { font-weight: 600; }
.list__sub { font-size: var(--fs-xs); color: var(--muted-fg); }
.chev { color: var(--muted-fg); font-size: 20px; }
.ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- flashcards ---------- */
.flash-stage { perspective: 1400px; margin: var(--sp-4) 0; }
.flash {
  position: relative; width: 100%; min-height: 320px; cursor: pointer;
  transform-style: preserve-3d; transition: transform .5s cubic-bezier(.2,.7,.2,1);
}
.flash.is-flipped { transform: rotateY(180deg); }
.flash__face {
  position: absolute; inset: 0; backface-visibility: hidden;
  display: flex; align-items: center; justify-content: center; text-align: center;
  padding: var(--sp-5); border-radius: var(--r-lg);
  background: var(--card); border: 1px solid var(--border); box-shadow: var(--shadow-lg);
}
.flash__face--back { transform: rotateY(180deg); background: var(--card-2); }
.flash__term { font-size: var(--fs-2xl); font-weight: 700; }
.flash__def { font-size: var(--fs-lg); color: var(--fg-soft); }
.flash__hint { position: absolute; bottom: 12px; left: 0; right: 0; font-size: var(--fs-xs); color: var(--muted-fg); }
.srs-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }

/* match game */
.match-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-2); }
.match-cell { min-height: 80px; border-radius: var(--r-sm); border: 1px solid var(--border); background: var(--card); padding: 10px; font-size: var(--fs-sm); cursor: pointer; display: flex; align-items: center; justify-content: center; text-align: center; }
.match-cell.sel { border-color: var(--primary); background: color-mix(in srgb, var(--primary) 12%, var(--card)); }
.match-cell.ok { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--card)); opacity: .55; pointer-events: none; }
.match-cell.bad { border-color: var(--destructive); animation: shake .3s; }
@keyframes shake { 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }

/* quiz options */
.opt { display: block; width: 100%; text-align: left; margin-top: 10px; padding: 14px; border-radius: var(--r-sm); border: 1px solid var(--border); background: var(--card); cursor: pointer; font: inherit; color: var(--fg); }
.opt.correct { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--card)); }
.opt.wrong { border-color: var(--destructive); background: color-mix(in srgb, var(--destructive) 12%, var(--card)); }
.opt:disabled { cursor: default; }

/* calendar */
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal-dow { text-align: center; font-size: var(--fs-xs); color: var(--muted-fg); font-weight: 700; padding: 4px 0; }
.cal-cell { aspect-ratio: 1; border-radius: var(--r-sm); border: 1px solid transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: var(--fs-sm); cursor: pointer; position: relative; }
.cal-cell.muted-day { color: var(--muted-fg); opacity: .4; }
.cal-cell.today { border-color: var(--primary); font-weight: 700; }
.cal-cell .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); position: absolute; bottom: 6px; }
.cal-cell .dot.exam { background: var(--destructive); }

/* notes / folders (letterboxd lists) */
.folder-chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: var(--r-full); border: 1px solid var(--border); background: var(--card); cursor: pointer; font-size: var(--fs-sm); font-weight: 600; }
.folder-chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.note-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--r); padding: var(--sp-4); cursor: pointer; box-shadow: var(--shadow); }
.note-card h3 { font-size: var(--fs-lg); }
.note-card__meta { font-size: var(--fs-xs); color: var(--muted-fg); }

/* facts */
.fact { font-size: var(--fs-xl); line-height: 1.4; }
.fact__src { font-size: var(--fs-xs); color: var(--muted-fg); margin-top: var(--sp-3); }

/* 3D */
.viewer { width: 100%; height: 56vh; min-height: 320px; border-radius: var(--r-lg); overflow: hidden; background: linear-gradient(160deg,#0b2730,#0e2c37); border: 1px solid var(--border); position: relative; touch-action: none; }
.viewer canvas { display: block; width: 100%; height: 100%; }
.viewer__hint { position: absolute; bottom: 10px; left: 0; right: 0; text-align: center; color: rgba(255,255,255,.7); font-size: var(--fs-xs); pointer-events: none; }
.viewer__loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #cfeff6; }

/* sheet */
.sheet { position: fixed; inset: 0; z-index: 60; }
.sheet[hidden] { display: none; }
.sheet__scrim { position: absolute; inset: 0; background: rgba(4,20,26,.5); animation: fade .2s; }
.sheet__panel { position: absolute; left: 0; right: 0; bottom: 0; background: var(--card); border-radius: var(--r-lg) var(--r-lg) 0 0; padding: var(--sp-3) var(--sp-4) calc(var(--sp-5) + env(safe-area-inset-bottom)); box-shadow: var(--shadow-lg); animation: slideup .25s cubic-bezier(.2,.7,.2,1); max-height: 86dvh; overflow: auto; }
.sheet__grip { width: 40px; height: 5px; border-radius: 3px; background: var(--border); margin: 4px auto 12px; }
@keyframes slideup { from { transform: translateY(100%); } }
@keyframes fade { from { opacity: 0; } }

/* toast */
.toast { position: fixed; left: 50%; bottom: calc(var(--tab-h) + 18px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 18px; border-radius: var(--r-full); font-size: var(--fs-sm); font-weight: 600; z-index: 80; box-shadow: var(--shadow-lg); }
.toast[hidden] { display: none; }

/* empty state */
.empty { text-align: center; padding: var(--sp-6) var(--sp-4); color: var(--muted-fg); }
.empty__emoji { font-size: 40px; }

/* streak ring */
.streak { display: inline-flex; align-items: center; gap: 8px; font-weight: 800; }
.markdown :is(h1,h2,h3){ margin-top: var(--sp-4); }
.markdown code { background: var(--muted); padding: 2px 6px; border-radius: 6px; font-size: .9em; }
.markdown pre { background: var(--muted); padding: 12px; border-radius: var(--r-sm); overflow:auto; }
.markdown ul, .markdown ol { padding-left: 22px; }
.markdown blockquote { border-left: 3px solid var(--primary); margin: 0; padding-left: 12px; color: var(--fg-soft); }

</style>

  <!-- ============================================================
       REVAMP — premium dark pastel design system (override layer)
       Cascades over the original tokens. Same class names, new soul.
       ============================================================ -->
  <style id="revamp">
  /* ---------- tokens: dark is the default ---------- */
  :root {
    /* fixed semantic colors (independent of theme accent) */
    --success: #79E3C0;
    --on-success: #06281E;
    --destructive: #FF8C9B;
    --warn: #FFCE8A;

    /* base surfaces (dark) */
    --bg: #0B0A11;
    --bg-grad:
      radial-gradient(1100px 680px at 88% -8%, color-mix(in srgb, var(--primary) 22%, transparent), transparent 60%),
      radial-gradient(900px 620px at -6% -2%, color-mix(in srgb, var(--warm) 16%, transparent), transparent 58%),
      linear-gradient(180deg, #0E0C16, #0A0910 60%);
    --card: #16141F;
    --card-2: #1B1827;
    --elev: #211D2F;
    --fg: #EEEBF7;
    --fg-soft: #C7C2D8;
    --muted: rgba(255,255,255,.055);
    --muted-2: rgba(255,255,255,.10);
    --muted-fg: #918BA6;
    --border: rgba(255,255,255,.085);
    --border-2: rgba(255,255,255,.14);
    --ring: var(--primary);

    /* type */
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
    --fs-xs: 12.5px; --fs-sm: 14px; --fs-base: 16px; --fs-lg: 18px;
    --fs-xl: 23px; --fs-2xl: 30px; --fs-3xl: 40px;

    --r-sm: 13px; --r: 19px; --r-lg: 27px; --r-full: 999px;
    --shadow: 0 1px 1px rgba(0,0,0,.5), 0 10px 26px rgba(0,0,0,.42);
    --shadow-lg: 0 24px 60px -12px rgba(0,0,0,.62);
    --glow: 0 14px 40px -10px color-mix(in srgb, var(--primary) 55%, transparent);
    --tab-h: 70px; --bar-h: 58px;
  }

  /* ---------- theme accent presets (work in both modes) ---------- */
  :root[data-theme="aurora"]   { --primary:#B6A6F7; --primary-600:#9A86F0; --primary-700:#7E6BDB; --on-primary:#1E1736; --secondary:#8FE6CE; --accent:#8FE6CE; --warm:#FFB79E; }
  :root[data-theme="lavender"] { --primary:#CBAAFF; --primary-600:#B388FF; --primary-700:#9A6CF0; --on-primary:#231640; --secondary:#E7ABF2; --accent:#E7ABF2; --warm:#F2A8D6; }
  :root[data-theme="mint"]     { --primary:#7FE3C2; --primary-600:#56D2AC; --primary-700:#36B894; --on-primary:#06281E; --secondary:#BCE89B; --accent:#BCE89B; --warm:#FFE08A; }
  :root[data-theme="peach"]    { --primary:#FFB59B; --primary-600:#FF9C7C; --primary-700:#F07F5E; --on-primary:#3A1A10; --secondary:#FFD79A; --accent:#FFD79A; --warm:#FFC9A8; }
  :root[data-theme="rose"]     { --primary:#FF9DB7; --primary-600:#FF7D9F; --primary-700:#EE5E86; --on-primary:#3A1320; --secondary:#FFC2A0; --accent:#FFC2A0; --warm:#FFB7C6; }
  :root[data-theme="ocean"]    { --primary:#85C9F2; --primary-600:#5DB2EC; --primary-700:#3B95D8; --on-primary:#06283A; --secondary:#8FE6CE; --accent:#8FE6CE; --warm:#A9B6FF; }

  /* ---------- light mode ---------- */
  :root[data-mode="light"] {
    --bg: #F6F4FB;
    --bg-grad:
      radial-gradient(1100px 680px at 88% -10%, color-mix(in srgb, var(--primary) 30%, transparent), transparent 60%),
      radial-gradient(900px 600px at -6% -4%, color-mix(in srgb, var(--warm) 26%, transparent), transparent 58%),
      linear-gradient(180deg, #FBFAFE, #F3F0FA 60%);
    --card: #FFFFFF;
    --card-2: #FBFAFE;
    --elev: #FFFFFF;
    --fg: #221C33;
    --fg-soft: #564E6B;
    --muted: rgba(20,12,40,.05);
    --muted-2: rgba(20,12,40,.09);
    --muted-fg: #7C7491;
    --border: rgba(20,12,40,.09);
    --border-2: rgba(20,12,40,.16);
    --shadow: 0 1px 2px rgba(60,40,110,.06), 0 10px 26px rgba(60,40,110,.10);
    --shadow-lg: 0 24px 60px -14px rgba(60,40,110,.22);
  }

  /* kill the original OS-based dark block from fighting us */
  body { background: var(--bg); background-image: var(--bg-grad); background-attachment: fixed; color: var(--fg);
         font-family: var(--font); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  h1,h2,h3 { color: var(--fg); letter-spacing: -.018em; }
  h2 { font-weight: 800; }
  a { color: var(--primary); }
  ::selection { background: color-mix(in srgb, var(--primary) 38%, transparent); }

  :root[data-density="compact"] { --sp-3: 9px; --sp-4: 12px; --sp-5: 18px; }

  /* ---------- app bar ---------- */
  .appbar {
    height: var(--bar-h);
    background: color-mix(in srgb, var(--bg) 72%, transparent);
    -webkit-backdrop-filter: saturate(1.6) blur(18px); backdrop-filter: saturate(1.6) blur(18px);
    border-bottom: 1px solid var(--border);
  }
  .appbar__title { font-size: var(--fs-lg); font-weight: 800; letter-spacing: -.02em; }
  .appbar__back, .appbar__action { color: var(--fg-soft); border-radius: var(--r-full); transition: background .15s, color .15s; }
  .appbar__action:active, .appbar__back:active { background: var(--muted-2); color: var(--fg); }

  /* ---------- bottom tabs ---------- */
  .tabbar {
    height: calc(var(--tab-h) + env(safe-area-inset-bottom));
    background: color-mix(in srgb, var(--bg) 80%, transparent);
    -webkit-backdrop-filter: saturate(1.6) blur(20px); backdrop-filter: saturate(1.6) blur(20px);
    border-top: 1px solid var(--border);
  }
  .tabbar__btn { color: var(--muted-fg); gap: 4px; font-size: 11px; font-weight: 600; position: relative; transition: color .18s; }
  .tabbar__icon { font-size: 21px; transition: transform .22s cubic-bezier(.2,.8,.2,1); filter: grayscale(.35) opacity(.9); }
  .tabbar__btn[aria-current="page"] { color: var(--primary); font-weight: 700; }
  .tabbar__btn[aria-current="page"] .tabbar__icon { transform: translateY(-3px) scale(1.12); filter: none; }
  .tabbar__btn[aria-current="page"]::before {
    content: ""; position: absolute; top: 8px; width: 40px; height: 40px; border-radius: var(--r-full);
    background: radial-gradient(circle, color-mix(in srgb, var(--primary) 26%, transparent), transparent 70%);
  }

  /* ---------- view enter animation (transform-only: never holds content invisible) ---------- */
  @media (prefers-reduced-motion: no-preference) {
    .view > * { animation: viewIn .5s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes viewIn { from { transform: translateY(14px) scale(.985); } }
    .stack > * { animation: riseIn .55s cubic-bezier(.2,.8,.2,1) both; }
    .stack > *:nth-child(2){animation-delay:.04s} .stack > *:nth-child(3){animation-delay:.08s}
    .stack > *:nth-child(4){animation-delay:.12s} .stack > *:nth-child(5){animation-delay:.16s}
    .stack > *:nth-child(n+6){animation-delay:.2s}
    @keyframes riseIn { from { transform: translateY(16px); } }
  }

  /* ---------- cards & primitives ---------- */
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--r);
    padding: var(--sp-4); box-shadow: var(--shadow);
    background-image: linear-gradient(180deg, color-mix(in srgb, #fff 4%, transparent), transparent 40%);
  }
  :root[data-mode="light"] .card { background-image: none; }
  .pill { background: var(--muted-2); color: var(--fg-soft); font-weight: 700; letter-spacing: .01em; padding: 5px 12px; }
  .pill--accent  { background: color-mix(in srgb, var(--success) 18%, transparent); color: var(--success); }
  .pill--primary { background: color-mix(in srgb, var(--primary) 20%, transparent); color: var(--primary); }
  .section-title { font-size: var(--fs-sm); letter-spacing: .08em; color: var(--muted-fg); font-weight: 800; text-transform: uppercase; margin: var(--sp-5) 0 var(--sp-3); }
  .muted { color: var(--muted-fg); }

  /* ---------- buttons ---------- */
  .btn { border-radius: var(--r-full); font-weight: 700; background: var(--muted-2); color: var(--fg);
         transition: transform .12s cubic-bezier(.2,.8,.2,1), box-shadow .2s, filter .2s; letter-spacing: -.01em; }
  .btn:active { transform: scale(.96); }
  .btn--primary { background: var(--primary); color: var(--on-primary); box-shadow: var(--glow); }
  .btn--primary:hover { filter: brightness(1.05); }
  .btn--accent { background: var(--success); color: var(--on-success); box-shadow: 0 14px 40px -10px color-mix(in srgb, var(--success) 55%, transparent); }
  .btn--ghost { background: transparent; border-color: var(--border-2); color: var(--fg); }
  .btn--danger { background: transparent; color: var(--destructive); border-color: color-mix(in srgb, var(--destructive) 45%, transparent); }

  /* ---------- inputs ---------- */
  .input, .textarea, select { background: var(--card-2); border: 1px solid var(--border-2); border-radius: var(--r-sm); color: var(--fg); transition: border-color .15s, box-shadow .15s; }
  .input:focus, .textarea:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px color-mix(in srgb, var(--primary) 22%, transparent); }
  .switch input:checked + .switch__track { background: var(--success); }
  .switch__track::after { background: #fff; }
  .bar { background: var(--muted-2); }
  .bar__fill { background: linear-gradient(90deg, var(--primary), var(--success)); }

  /* ---------- hero ---------- */
  .hero {
    border-radius: var(--r-lg); color: #fff;
    background:
      radial-gradient(120% 130% at 0% 0%, color-mix(in srgb, var(--primary) 42%, transparent), transparent 58%),
      radial-gradient(130% 130% at 100% 8%, color-mix(in srgb, var(--warm) 34%, transparent), transparent 56%),
      linear-gradient(135deg, var(--elev), var(--card-2));
    border: 1px solid var(--border-2);
    box-shadow: var(--shadow-lg);
    position: relative; overflow: hidden;
  }
  .hero::after { content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
                 box-shadow: inset 0 1px 0 rgba(255,255,255,.14); }
  :root[data-mode="light"] .hero { color: var(--fg); }
  :root[data-mode="light"] .hero .muted { color: var(--fg-soft); }
  .hero h2 { color: inherit; font-size: var(--fs-2xl); letter-spacing: -.025em; }
  .hero .muted { color: rgba(255,255,255,.86); }
  .hero .pill { background: rgba(255,255,255,.18); color: #fff; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
  :root[data-mode="light"] .hero .pill { background: color-mix(in srgb, var(--primary) 20%, transparent); color: var(--primary-700); }

  /* ---------- home tiles ---------- */
  .tiles { gap: var(--sp-3); }
  .tile {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--r);
    box-shadow: var(--shadow); min-height: 112px; gap: 10px; padding: var(--sp-4);
    transition: transform .16s cubic-bezier(.2,.8,.2,1), border-color .2s, box-shadow .2s;
    position: relative; overflow: hidden;
  }
  .tile:hover { transform: translateY(-3px); border-color: var(--border-2); }
  .tile:active { transform: scale(.97); }
  .tile__emoji {
    font-size: 22px; width: 46px; height: 46px; display: inline-flex; align-items: center; justify-content: center;
    border-radius: 14px; background: color-mix(in srgb, var(--primary) 18%, var(--card-2));
    box-shadow: inset 0 0 0 1px var(--border);
  }
  .tile__name { font-weight: 800; letter-spacing: -.01em; color: var(--fg); }
  .tile__sub { color: var(--muted-fg); }

  /* ---------- list rows ---------- */
  .list { border: 1px solid var(--border); border-radius: var(--r); background: var(--card); box-shadow: var(--shadow); }
  .list__item { gap: var(--sp-3); border-bottom: 1px solid var(--border); transition: background .15s; min-height: 62px; }
  .list__item:active { background: var(--muted); }
  .list__item .tile__emoji { width: 40px; height: 40px; font-size: 19px; flex: none; }
  .list__title { font-weight: 700; }
  .chev { color: var(--muted-fg); }

  /* ---------- flashcards ---------- */
  .flash__face {
    border-radius: var(--r-lg); border: 1px solid var(--border-2); box-shadow: var(--shadow-lg);
    background: linear-gradient(160deg, var(--elev), var(--card));
  }
  .flash__face--back {
    background:
      radial-gradient(120% 120% at 100% 0%, color-mix(in srgb, var(--primary) 22%, transparent), transparent 60%),
      linear-gradient(160deg, var(--card-2), var(--card));
  }
  .flash__term { font-size: var(--fs-2xl); letter-spacing: -.02em; }
  .flash__def { font-size: var(--fs-lg); color: var(--fg-soft); }
  .flash__hint { color: var(--muted-fg); }
  .srs-row { gap: 8px; }

  /* ---------- match game ---------- */
  .match-cell { border-radius: var(--r-sm); border: 1px solid var(--border-2); background: var(--card); font-weight: 600; transition: transform .12s, border-color .15s, background .15s; }
  .match-cell:active { transform: scale(.97); }
  .match-cell.sel { border-color: var(--primary); background: color-mix(in srgb, var(--primary) 16%, var(--card)); }
  .match-cell.ok  { border-color: var(--success); background: color-mix(in srgb, var(--success) 18%, var(--card)); animation: pop .32s cubic-bezier(.2,.9,.2,1); }
  .match-cell.bad { border-color: var(--destructive); }
  @keyframes pop { 30% { transform: scale(1.06); } }

  /* ---------- quiz options ---------- */
  .opt { border-radius: var(--r-sm); border: 1px solid var(--border-2); background: var(--card); font-weight: 600; transition: transform .12s, border-color .15s, background .15s; }
  .opt:not(:disabled):hover { border-color: var(--primary); transform: translateX(2px); }
  .opt.correct { border-color: var(--success); background: color-mix(in srgb, var(--success) 16%, var(--card)); animation: pop .34s cubic-bezier(.2,.9,.2,1); }
  .opt.wrong { border-color: var(--destructive); background: color-mix(in srgb, var(--destructive) 14%, var(--card)); }

  /* ---------- calendar ---------- */
  .cal-grid { gap: 6px; }
  .cal-cell { border-radius: var(--r-sm); transition: background .12s, border-color .15s, transform .1s; background: var(--card-2); border: 1px solid var(--border); color: var(--fg); font-weight: 600; -webkit-appearance: none; appearance: none; }
  .cal-cell:hover { background: var(--elev); border-color: var(--border-2); }
  .cal-cell:active { transform: scale(.95); }
  .cal-cell.muted-day { background: transparent; border-color: transparent; }
  .cal-cell.today { border-color: var(--primary); color: var(--primary); font-weight: 800; box-shadow: inset 0 0 0 1px var(--primary), var(--glow); background: color-mix(in srgb, var(--primary) 14%, var(--card)); }
  .cal-cell .dot { background: var(--success); }
  .cal-cell .dot.exam { background: var(--warm); }

  /* ---------- notes ---------- */
  .folder-chip { border-radius: var(--r-full); border: 1px solid var(--border-2); background: var(--card); font-weight: 700; transition: transform .12s; }
  .folder-chip:active { transform: scale(.96); }
  .folder-chip.active { background: var(--primary); color: var(--on-primary); border-color: transparent; }
  .note-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--r); box-shadow: var(--shadow); transition: transform .15s, border-color .2s; }
  .note-card:hover { transform: translateY(-2px); border-color: var(--border-2); }

  /* ---------- facts ---------- */
  .fact { font-size: var(--fs-xl); letter-spacing: -.01em; }

  /* ---------- 3D viewer ---------- */
  .viewer { border-radius: var(--r-lg); border: 1px solid var(--border-2);
            background: radial-gradient(130% 130% at 20% 0%, color-mix(in srgb, var(--primary) 28%, #0a1822), #07121a 70%); }

  /* ---------- sheet ---------- */
  .sheet__scrim { background: rgba(6,4,14,.62); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
  .sheet__panel { background: var(--card); border-radius: var(--r-lg) var(--r-lg) 0 0; border: 1px solid var(--border); border-bottom: 0; box-shadow: var(--shadow-lg); }
  .sheet__grip { background: var(--border-2); }

  /* ---------- toast ---------- */
  .toast { background: var(--elev); color: var(--fg); border: 1px solid var(--border-2); box-shadow: var(--shadow-lg); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }

  /* ---------- empty / completion ---------- */
  .empty { padding: var(--sp-6) var(--sp-4); }
  .empty__emoji { font-size: 52px; animation: bounceIn .6s cubic-bezier(.2,1.4,.4,1) both; }
  @keyframes bounceIn { 0%{ opacity:0; transform: scale(.4); } 60%{ transform: scale(1.12);} 100%{ opacity:1; transform: scale(1);} }
  .score-ring { position: relative; width: 148px; height: 148px; margin: 0 auto var(--sp-4); }
  .score-ring svg { display: block; }
  .score-ring__center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  .score-ring__emoji { font-size: 30px; line-height: 1; }
  .score-ring__pct { font-size: 26px; font-weight: 800; letter-spacing: -.03em; color: var(--fg); }

  /* ---------- streak chip ---------- */
  .streak { padding: 8px 14px; border-radius: var(--r-full); font-weight: 800; font-size: var(--fs-base);
            background: color-mix(in srgb, var(--warm) 24%, transparent); color: #fff;
            box-shadow: 0 8px 24px -8px color-mix(in srgb, var(--warm) 70%, transparent); }
  :root[data-mode="light"] .streak { color: var(--primary-700); }

  /* ---------- bf's signature line ---------- */
  .love-sig { display:flex; align-items:center; gap:8px; font-size: var(--fs-sm); font-weight:600;
              color: rgba(255,255,255,.82); margin-top: 4px; }
  :root[data-mode="light"] .love-sig { color: var(--fg-soft); }
  .love-sig .heart { display:inline-block; animation: heartbeat 1.8s ease-in-out infinite; }
  @keyframes heartbeat { 0%,100%{ transform: scale(1);} 14%{ transform: scale(1.25);} 28%{ transform: scale(1);} 42%{ transform: scale(1.18);} }

  /* appearance theme swatches (settings) */
  .swatches { display:flex; flex-wrap:wrap; gap:10px; }
  .swatch { width:46px; height:46px; border-radius:14px; border:2px solid var(--border-2); cursor:pointer; position:relative;
            display:flex; align-items:center; justify-content:center; transition: transform .12s; padding:0; }
  .swatch:active { transform: scale(.92); }
  .swatch[aria-pressed="true"] { border-color:#fff; box-shadow: 0 0 0 2px var(--primary); }
  .seg { display:inline-flex; background: var(--muted-2); border-radius: var(--r-full); padding:4px; gap:4px; }
  .seg button { border:0; background:transparent; color:var(--muted-fg); font:inherit; font-weight:700; padding:8px 16px; border-radius:var(--r-full); cursor:pointer; min-height:38px; }
  .seg button[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); }

  /* confetti canvas */
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 95; }

  /* ---------- progress diagrams (home) ---------- */
  .progress-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--r); box-shadow: var(--shadow); padding: var(--sp-4); }
  .welcome { text-align: center; padding: 10px 6px 4px; }
  .welcome__emoji { font-size: 40px; line-height: 1; animation: heartbeat 1.8s ease-in-out infinite; }
  .welcome__title { font-size: var(--fs-xl); font-weight: 800; letter-spacing: -.02em; margin-top: 10px; color: var(--fg); }
  .welcome__sub { color: var(--muted-fg); font-size: var(--fs-sm); margin-top: 6px; max-width: 42ch; margin-left: auto; margin-right: auto; line-height: 1.5; }
  .welcome__chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 14px; }
  .welcome__chip { background: var(--muted-2); color: var(--fg-soft); font-weight: 700; font-size: var(--fs-xs); padding: 6px 12px; border-radius: var(--r-full); }
  .prog-top { display: grid; grid-template-columns: auto 1fr; gap: var(--sp-4); align-items: center; }
  .ring-wrap { position: relative; width: 116px; height: 116px; flex: none; }
  .ring-wrap svg { transform: rotate(-90deg); display: block; }
  .ring-bg { fill: none; stroke: var(--muted-2); }
  .ring-fg { fill: none; stroke: url(#ringGrad); stroke-linecap: round; }
  .ring-label { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .ring-pct { font-size: 28px; font-weight: 800; letter-spacing: -.03em; color: var(--fg); line-height: 1; }
  .ring-cap { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted-fg); margin-top: 3px; }
  .prog-legend { display: flex; flex-direction: column; gap: 10px; }
  .legend-row { display: flex; align-items: center; gap: 10px; }
  .legend-dot { width: 11px; height: 11px; border-radius: 4px; flex: none; }
  .legend-n { font-weight: 800; font-size: var(--fs-lg); color: var(--fg); min-width: 30px; }
  .legend-l { color: var(--muted-fg); font-weight: 600; font-size: var(--fs-sm); }
  /* leitner distribution bar */
  .leitner { margin-top: var(--sp-4); }
  .leitner__track { display: flex; height: 16px; border-radius: var(--r-full); overflow: hidden; background: var(--muted-2); box-shadow: inset 0 0 0 1px var(--border); }
  .leitner__seg { min-width: 0; }
  .leitner__keys { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 10px; }
  .leitner__key { display: flex; align-items: center; gap: 6px; font-size: var(--fs-xs); color: var(--muted-fg); font-weight: 600; }
  .leitner__key i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }
  /* per-deck bars */
  .deckbars { display: flex; flex-direction: column; gap: 12px; margin-top: 2px; }
  .deckbar__top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 6px; }
  .deckbar__name { font-weight: 700; font-size: var(--fs-sm); color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .deckbar__pct { font-weight: 800; font-size: var(--fs-xs); color: var(--muted-fg); flex: none; }
  .deckbar__track { height: 9px; border-radius: var(--r-full); background: var(--muted-2); overflow: hidden; }
  .deckbar__fill { height: 100%; border-radius: var(--r-full); background: linear-gradient(90deg, var(--primary), var(--success)); width: var(--w, 0); }
  /* weekly activity bars */
  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; align-items: end; height: 84px; }
  .week__col { display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
  .week__bar { width: 100%; max-width: 26px; border-radius: 7px 7px 4px 4px; background: linear-gradient(180deg, var(--primary), var(--primary-700)); min-height: 4px; height: var(--h, 6%); }
  .week__bar.is-today { background: linear-gradient(180deg, var(--success), var(--primary)); box-shadow: var(--glow); }
  .week__bar.is-empty { background: var(--muted-2); }
  .week__lbl { font-size: 11px; font-weight: 700; color: var(--muted-fg); }
  .week__col.is-today .week__lbl { color: var(--primary); }

  /* iPad / wide: center the column nicely */
  @media (min-width: 820px) {
    .view { max-width: 820px; }
    .tiles { grid-template-columns: repeat(3, 1fr); }
  }

  /* ---------- round-2 visual upgrades ---------- */

  /* new tokens */
  :root {
    --glow-soft: 0 8px 28px -8px color-mix(in srgb, var(--primary) 35%, transparent);
    --card-hover: 0 12px 36px -8px color-mix(in srgb, var(--primary) 22%, rgba(0,0,0,.45));
  }

  /* hero greeting: animated gradient text */
  .hero-greeting {
    background: linear-gradient(110deg, var(--fg) 20%, var(--primary) 55%, var(--accent) 80%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    background-size: 220% auto;
    animation: gradShift 5s linear infinite;
  }
  @keyframes gradShift { 0%{ background-position:0% center; } 100%{ background-position:220% center; } }

  /* hero stat row */
  .hero-stats { display:flex; flex-wrap:wrap; gap:10px; margin-top:14px; }
  .hero-stat { display:flex; align-items:center; gap:7px; background:rgba(255,255,255,.13); border:1px solid rgba(255,255,255,.16); border-radius:var(--r-full); padding:7px 14px; font-size:var(--fs-sm); font-weight:700; color:#fff; -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); }
  :root[data-mode="light"] .hero-stat { background:color-mix(in srgb,var(--primary) 14%,transparent); border-color:color-mix(in srgb,var(--primary) 28%,transparent); color:var(--primary-700); }
  .hero-stat__icon { font-size:16px; }

  /* card lift on hover */
  .card:hover { box-shadow: var(--card-hover); transform: translateY(-2px); }
  .card { transition: transform .18s cubic-bezier(.2,.8,.2,1), box-shadow .2s; }

  (function () {
    var OWNER = "jennyhuyn06@outlook.com";
    var KEY = "ma.owner";
    function isUnlocked() { try { return localStorage.getItem(KEY) === "1"; } catch (e) { return false; } }
    var gate = document.getElementById("ownerGate");
    if (isUnlocked()) { if (gate && gate.parentNode) gate.parentNode.removeChild(gate); return; }

        gate.style.transition = "opacity .25s"; gate.style.opacity = "0";
        if (navigator.vibrate) { try { navigator.vibrate([8, 40, 12]); } catch (e3) {} }
        setTimeout(function () { if (gate.parentNode) gate.parentNode.removeChild(gate); }, 260);

<script>
/* ---- js/store.js ---- */
/* store.js — on-device persistence (IndexedDB with a localStorage fallback).
   Everything the user creates lives here; nothing leaves the device. */
(function () {
  "use strict";
  window.MA = window.MA || {};

  var DB_NAME = "ma-study";
  var DB_VER = 2;
  var STORES = ["kv", "notes", "folders", "events", "owned"]; // object stores
  var dbp = null;

  function open() {
    if (dbp) return dbp;
    dbp = new Promise(function (resolve, reject) {
      if (!("indexedDB" in window)) { reject(new Error("no-idb")); return; }
      var req = indexedDB.open(DB_NAME, DB_VER);
      req.onupgradeneeded = function () {
        var db = req.result;
        STORES.forEach(function (s) {
          if (!db.objectStoreNames.contains(s)) db.createObjectStore(s, { keyPath: "id" });
        });
      };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error); };
    });
    return dbp;
  }

  function tx(store, mode) {
    return open().then(function (db) {
      return db.transaction(store, mode).objectStore(store);
    });
  }
  function reqP(r) {
    return new Promise(function (res, rej) { r.onsuccess = function () { res(r.result); }; r.onerror = function () { rej(r.error); }; });
  }

  // ---- localStorage fallback (used only if IndexedDB is unavailable) ----
  var LS = {
    key: function (s) { return "ma:" + s; },
    all: function (s) { try { return JSON.parse(localStorage.getItem(LS.key(s)) || "[]"); } catch (e) { return []; } },
    save: function (s, arr) { localStorage.setItem(LS.key(s), JSON.stringify(arr)); }
  };
  var useLS = !("indexedDB" in window);

  var store = {
    /* generic record API over a named store */
    put: function (s, obj) {
      if (!obj.id) obj.id = MA.util ? MA.util.uid() : String(Date.now()) + Math.random().toString(36).slice(2);
      if (useLS) { var a = LS.all(s).filter(function (x) { return x.id !== obj.id; }); a.push(obj); LS.save(s, a); return Promise.resolve(obj); }
      return tx(s, "readwrite").then(function (os) { return reqP(os.put(obj)); }).then(function () { return obj; });
    },
    get: function (s, id) {
      if (useLS) return Promise.resolve(LS.all(s).filter(function (x) { return x.id === id; })[0] || null);
      return tx(s, "readonly").then(function (os) { return reqP(os.get(id)); });
    },
    all: function (s) {
      if (useLS) return Promise.resolve(LS.all(s));
      return tx(s, "readonly").then(function (os) { return reqP(os.getAll()); });
    },
    del: function (s, id) {
      if (useLS) { LS.save(s, LS.all(s).filter(function (x) { return x.id !== id; })); return Promise.resolve(); }
      return tx(s, "readwrite").then(function (os) { return reqP(os.delete(id)); });
    },

    /* convenience key/value (settings, srs map, quiz results) stored in "kv" */
    setKV: function (key, value) { return store.put("kv", { id: key, value: value }); },
    getKV: function (key, def) {
      return store.get("kv", key).then(function (r) { return r ? r.value : (def === undefined ? null : def); });
    }
  };

  MA.store = store;
})();

</script>
<script>
/* ---- js/modules/util.js ---- */
/* util.js — tiny DOM + helpers shared across modules. */
(function () {
  "use strict";
  window.MA = window.MA || {};

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function (k) {
      var v = attrs[k];
      if (k === "class") node.className = v;
      else if (k === "html") node.innerHTML = v;
      else if (k === "text") node.textContent = v;
      else if (k === "dataset") Object.keys(v).forEach(function (d) { node.dataset[d] = v[d]; });
      else if (k.slice(0, 2) === "on" && typeof v === "function") node.addEventListener(k.slice(2).toLowerCase(), v);
      else if (v === true) node.setAttribute(k, "");
      else if (v !== false && v != null) node.setAttribute(k, v);
    });
    (Array.isArray(children) ? children : children != null ? [children] : []).forEach(function (c) {
      if (c == null) return;
      node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
    return node;
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

  function fmtDate(ts, opts) {
    try { return new Date(ts).toLocaleDateString(undefined, opts || { month: "short", day: "numeric", year: "numeric" }); }
    catch (e) { return new Date(ts).toDateString(); }
  }

  function daysUntil(ts) {
    var ms = new Date(ts).setHours(0, 0, 0, 0) - new Date().setHours(0, 0, 0, 0);
    return Math.round(ms / 86400000);
  }

  // ISO week number — drives deterministic "weekly quiz" selection offline.
  function isoWeek(d) {
    d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    var day = (d.getUTCDay() + 6) % 7;
    d.setUTCDate(d.getUTCDate() - day + 3);
    var firstThu = new Date(Date.UTC(d.getUTCFullYear(), 0, 4));
    return 1 + Math.round(((d - firstThu) / 86400000 - 3 + ((firstThu.getUTCDay() + 6) % 7)) / 7);
  }
  function weekKey(date) { var d = date || new Date(); return d.getFullYear() + "-W" + isoWeek(d); }

  // seeded shuffle (deterministic when a seed string is given)
  function shuffle(arr, seed) {
    var a = arr.slice(), rnd = seed == null ? Math.random : mulberry(hashStr(seed));
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(rnd() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function hashStr(s) { var h = 2166136261; for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  function mulberry(a) { return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; var t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

  // very small, safe markdown -> html (headings, bold, italics, lists, code, links, blockquote)
  function mdToHtml(md) {
    var lines = String(md || "").replace(/\r\n/g, "\n").split("\n");
    var out = [], inUl = false, inOl = false, inCode = false;
    function closeLists() { if (inUl) { out.push("</ul>"); inUl = false; } if (inOl) { out.push("</ol>"); inOl = false; } }
    for (var i = 0; i < lines.length; i++) {
      var ln = lines[i];
      if (/^```/.test(ln)) { if (inCode) { out.push("</code></pre>"); inCode = false; } else { closeLists(); out.push("<pre><code>"); inCode = true; } continue; }
      if (inCode) { out.push(esc(ln)); continue; }
      var h = ln.match(/^(#{1,3})\s+(.*)$/);
      if (h) { closeLists(); out.push("<h" + h[1].length + ">" + inline(h[2]) + "</h" + h[1].length + ">"); continue; }
      if (/^>\s?/.test(ln)) { closeLists(); out.push("<blockquote>" + inline(ln.replace(/^>\s?/, "")) + "</blockquote>"); continue; }
      if (/^\s*[-*]\s+/.test(ln)) { if (!inUl) { closeLists(); out.push("<ul>"); inUl = true; } out.push("<li>" + inline(ln.replace(/^\s*[-*]\s+/, "")) + "</li>"); continue; }
      if (/^\s*\d+\.\s+/.test(ln)) { if (!inOl) { closeLists(); out.push("<ol>"); inOl = true; } out.push("<li>" + inline(ln.replace(/^\s*\d+\.\s+/, "")) + "</li>"); continue; }
      if (/^\s*$/.test(ln)) { closeLists(); continue; }
      closeLists(); out.push("<p>" + inline(ln) + "</p>");
    }
    closeLists(); if (inCode) out.push("</code></pre>");
    return out.join("\n");
    function inline(s) {
      return esc(s)
        .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
        .replace(/(^|[^*])\*([^*]+)\*/g, "$1<em>$2</em>")
        .replace(/`([^`]+)`/g, "<code>$1</code>");
    }
  }

  function download(filename, text, mime) {
    var blob = new Blob([text], { type: mime || "text/plain;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = el("a", { href: url, download: filename });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  MA.util = { el: el, esc: esc, uid: uid, fmtDate: fmtDate, daysUntil: daysUntil, isoWeek: isoWeek, weekKey: weekKey, shuffle: shuffle, mdToHtml: mdToHtml, download: download };
})();

</script>
<script>
/* ---- js/modules/economy.js ---- */
/* economy.js — Study Coins wallet: streak/character multiplier, earn/spend/grant,
   and the floating "+N coin" fx. This is the foundation every other gamified-economy
   module (characters, daily login, shop, quiz/flashcard/anatomy hooks) calls into.
   It only reads kv (via MA.store) and listens for ma:character / ma:login — it never
   references MA.characters or MA.daily, which don't exist yet. */
(function () {
  "use strict";
  var MA = window.MA, U = MA.util, el = U.el;

  var LADDER = [1.0, 1.2, 1.5, 1.8, 2.2, 2.7, 3.5]; // streak day 1..7+ -> multiplier (holds at 3.5 past day 7)

  function streakMult(streak) {
    streak = streak || 0;
    if (streak < 1) return 1.0;
    return LADDER[Math.min(Math.max(streak, 1), 7) - 1];
  }

  function effectiveMultiplier() {
    return streakMult(state.streak) * (state.character === "prowler" ? 1.5 : 1);
  }

  // local (not UTC) calendar date as YYYY-MM-DD — drives the earnedToday daily reset.
  function todayLocal() {
    var d = new Date();
    return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  }

  var state = { wallet: 0, lifetime: 0, earnedToday: { date: todayLocal(), amount: 0 }, character: null, streak: 0 };

  // hydrate in-memory cache from kv; ready resolves once state reflects persisted values.
  var ready = Promise.all([
    MA.store.getKV("wallet", 0),
    MA.store.getKV("walletLifetime", 0),
    MA.store.getKV("earnedToday", null),
    MA.store.getKV("character", null),
    MA.store.getKV("login", null)
  ]).then(function (r) {
    var today = todayLocal();
    var et = r[2];
    state.wallet = r[0] || 0;
    state.lifetime = r[1] || 0;
    state.earnedToday = (et && et.date === today) ? et : { date: today, amount: 0 };
    state.character = r[3] || null;
    state.streak = (r[4] && r[4].streak) || 0;
  });

  /* ---------- floating "+N coin" fx ---------- */
  function reducedMotion() { return window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches; }

  function anchorPoint(anchorEl) {
    var node = (anchorEl && anchorEl.getBoundingClientRect) ? anchorEl : document.querySelector(".wallet-amount");
    if (!node) node = document.getElementById("appTitle");
    if (node && node.getBoundingClientRect) {
      var r = node.getBoundingClientRect();
      return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
    }
    return { x: window.innerWidth / 2, y: 70 };
  }

  // bump any wallet-balance display already on screen (Home/Shop wire this up later).
  function bumpWalletDisplays() {
    var nodes = document.querySelectorAll(".wallet-amount");
    for (var i = 0; i < nodes.length; i++) {
      (function (n) {
        n.classList.remove("wallet-amount--bump");
        void n.offsetWidth; // restart the CSS animation
        n.classList.add("wallet-amount--bump");
      })(nodes[i]);
    }
  }

  function showCoinFx(amount, anchorEl) {
    var text = (amount >= 0 ? "+" : "") + amount + " 🪙";
    bumpWalletDisplays();
    if (reducedMotion()) { if (MA.app && MA.app.toast) MA.app.toast(text); return; }
    var pt = anchorPoint(anchorEl);
    var chip = el("div", { class: "coin-fx", "aria-hidden": "true", style: "left:" + pt.x.toFixed(0) + "px;top:" + pt.y.toFixed(0) + "px;" }, text);
    document.body.appendChild(chip);
    setTimeout(function () { if (chip.parentNode) chip.parentNode.removeChild(chip); }, 950);
  }

  /* ---------- events ---------- */
  function dispatchCoins(earned) {
    var detail = { balance: state.wallet, lifetime: state.lifetime, earnedToday: state.earnedToday.amount };
    if (earned !== undefined) detail.earned = earned;
    window.dispatchEvent(new CustomEvent("ma:coins", { detail: detail }));
  }

  window.addEventListener("ma:character", function (e) {
    state.character = (e.detail && e.detail.character) || null;
  });
  window.addEventListener("ma:login", function (e) {
    if (e.detail && typeof e.detail.streak === "number") state.streak = e.detail.streak;
  });

  /* ---------- public API ---------- */
  function earnCoins(baseAmount, source, anchorEl) {
    var earned = Math.round(baseAmount * effectiveMultiplier());
    state.wallet += earned;
    state.lifetime += earned;
    var today = todayLocal();
    if (state.earnedToday.date !== today) state.earnedToday = { date: today, amount: 0 };
    state.earnedToday.amount += earned;

    // fire-and-forget, but chained so the three writes land in order
    MA.store.setKV("wallet", state.wallet)
      .then(function () { return MA.store.setKV("walletLifetime", state.lifetime); })
      .then(function () { return MA.store.setKV("earnedToday", state.earnedToday); });

    showCoinFx(earned, anchorEl);
    dispatchCoins(earned);
    return earned;
  }

  function spend(amount) {
    amount = Math.round(amount) || 0;
    if (state.wallet < amount) return Promise.resolve(false);
    state.wallet -= amount;
    return MA.store.setKV("wallet", state.wallet).then(function () {
      dispatchCoins();
      return true;
    });
  }

  // Direct, unmultiplied credit (welcome bonus, daily-login payout) — bypasses the
  // streak/character multiplier in earnCoins on purpose. Does not touch earnedToday.
  function grant(n) {
    n = Math.round(n) || 0;
    state.wallet += n;
    state.lifetime += n;
    MA.store.setKV("wallet", state.wallet).then(function () { return MA.store.setKV("walletLifetime", state.lifetime); });
    dispatchCoins(n);
    return n;
  }

  function getWallet() { return state.wallet; }
  function getLifetime() { return state.lifetime; }
  function getEarnedToday() { return state.earnedToday.amount; }

  MA.economy = {
    streakMult: streakMult,
    effectiveMultiplier: effectiveMultiplier,
    earnCoins: earnCoins,
    spend: spend,
    grant: grant,
    getWallet: getWallet,
    getLifetime: getLifetime,
    getEarnedToday: getEarnedToday,
    ready: ready
  };
})();

</script>

<script>
/* ---- js/modules/characters.js ---- */
/* characters.js — the 4 playable characters (bonuses honored by economy/shop/learn in
   later tasks), the first-launch selection modal, and Settings re-select. Grants the
   one-time 500-coin welcome bonus via the unmultiplied MA.economy.grant() — never
   earnCoins(), which applies the streak/character multiplier. */
(function () {
  "use strict";
  var MA = window.MA, U = MA.util, el = U.el;

  var LIST = [
    { id: "diva", emoji: "👑", name: "Diva", bonus: "15% off every shop purchase" },
    { id: "prowler", emoji: "🐆", name: "Prowler", bonus: "×1.5 coins on all studying" },
    { id: "expert", emoji: "🧠", name: "Expert", bonus: "×1.5 daily login bonus + 1 free streak freeze/week" },
    { id: "analyst", emoji: "🔍", name: "Analyst", bonus: "3 Learn hint charges (refills 1 every 5 min)" }
  ];

  var current = null;
  // in-memory cache of kv firstRunDone, hydrated once below. This is the source of
  // truth select() claims synchronously against (see there) — reading kv fresh on
  // every select() call would leave a check-then-act window where two overlapping
  // select() calls (double-click, or two cards clicked before the first settles)
  // both observe "not done yet" and both grant the welcome bonus.
  var firstRunDone = false;
  // hydrate the sync-readable caches from kv; never rejects (kv unavailable -> no
  // character, firstRunDone stays false so a later select() still works standalone).
  var ready = Promise.all([
    MA.store.getKV("character", null),
    MA.store.getKV("firstRunDone", false)
  ]).then(function (r) {
    current = r[0] || null;
    firstRunDone = !!r[1];
  }).catch(function () { current = null; firstRunDone = false; });

  function getCharacter() { return current; }
  function list() { return LIST.slice(); }

  /* ---------- select / welcome grant ---------- */
  function select(id) {
    return ready.then(function () {
      // Synchronous check-and-set on the in-memory flag (no `await` between the read
      // and the write): whichever call reaches this line first flips firstRunDone to
      // true immediately, so any other overlapping select() call — before its own
      // kv/economy round trip even starts — already sees the bonus as claimed.
      var wasFirstRun = !firstRunDone;
      if (wasFirstRun) firstRunDone = true;
      // Tracks whether MA.economy.grant(500) actually ran for THIS call. A failure
      // anywhere before this flips true (character persist, economy.ready, grant
      // itself) means no coins were issued, so the claim above must be rolled back —
      // otherwise a retry would see firstRunDone stuck true and silently skip the
      // bonus forever. A failure AFTER this flips true (only the firstRunDone persist
      // rejected) means the credit is real, so the in-memory flag must stay claimed —
      // rolling it back there would let a retry double-grant.
      var credited = false;
      current = id;
      return MA.store.setKV("character", id).then(function () {
        window.dispatchEvent(new CustomEvent("ma:character", { detail: { character: id } }));
        if (!wasFirstRun) return null;
        // gate the first economy mutation on hydration finishing (see cross-task notes) —
        // an early grant can otherwise be clobbered by economy's kv hydration.
        return MA.economy.ready.then(function () {
          MA.economy.grant(500);
          credited = true;
          return MA.store.setKV("firstRunDone", true);
        }).then(function () {
          if (MA.celebrate) MA.celebrate({ count: 90, y: (window.innerHeight || 800) * 0.4 });
          if (MA.app && MA.app.toast) MA.app.toast("Welcome! +500 🪙 to get you started");
        });
      }).catch(function (err) {
        if (wasFirstRun && !credited) firstRunDone = false;
        throw err;
      });
    }).catch(function () {
      // kv unavailable, or a failure above that already rolled back the in-memory
      // claim when no credit was issued — still flip the in-memory character + event
      // so earning/bonuses keep working; just skip the (unpersistable) welcome grant.
      current = id;
      window.dispatchEvent(new CustomEvent("ma:character", { detail: { character: id } }));
    }).then(function () { return id; });
  }

  /* ---------- chooser modal (2x2 grid) ---------- */
  function openChooser(opts) {
    opts = opts || {};
    var firstRun = !!opts.firstRun;
    var lastFocused = document.activeElement;
    var titleId = "charModalTitle" + Date.now();

    var overlay = el("div", { class: "char-modal", role: "dialog", "aria-modal": "true", "aria-labelledby": titleId });
    var card = el("div", { class: "char-modal__card" });
    overlay.appendChild(card);

    function focusables() {
      return Array.prototype.slice.call(overlay.querySelectorAll("button, [href], input, select, textarea, [tabindex]:not([tabindex='-1'])"))
        .filter(function (n) { return !n.disabled && n.offsetParent !== null; });
    }
    function close() {
      if (!overlay.parentNode) return;
      document.removeEventListener("keydown", onKeydown);
      overlay.parentNode.removeChild(overlay);
      if (lastFocused && lastFocused.focus) { try { lastFocused.focus(); } catch (e) {} }
    }
    function onKeydown(e) {
      if (e.key === "Escape") { if (!firstRun) close(); return; }
      if (e.key === "Tab") {
        var f = focusables();
        if (!f.length) return;
        var first = f[0], last = f[f.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    }

    if (!firstRun) {
      card.appendChild(el("button", { class: "char-modal__close", type: "button", "aria-label": "Close", onclick: close }, "✕"));
      overlay.addEventListener("click", function (e) { if (e.target === overlay) close(); });
    }

    card.appendChild(el("h3", { id: titleId, class: "char-modal__title", text: firstRun ? "Choose your character" : "Switch character" }));
    card.appendChild(el("p", { class: "char-modal__sub", text: firstRun
      ? "Pick who's studying with you — this sets your starting bonus and gives you a 500 🪙 welcome gift."
      : "Pick a new character any time. Your bonus swaps immediately." }));

    var grid = el("div", { class: "char-grid" });
    LIST.forEach(function (c) {
      var active = current === c.id;
      var chooseBtn = el("button", {
        class: "btn btn--primary btn--sm", type: "button", "aria-label": "Choose " + c.name
      }, active ? "Selected ✓" : "Choose");
      chooseBtn.addEventListener("click", function () { select(c.id).then(function () { close(); }); });
      grid.appendChild(el("div", { class: "char-card" + (active ? " char-card--active" : "") }, [
        el("div", { class: "char-card__emoji", "aria-hidden": "true", text: c.emoji }),
        el("div", { class: "char-card__name", text: c.name }),
        el("div", { class: "char-card__bonus", text: c.bonus }),
        chooseBtn
      ]));
    });
    card.appendChild(grid);

    document.addEventListener("keydown", onKeydown);
    document.body.appendChild(overlay);
    setTimeout(function () { var f = focusables(); if (f.length) f[0].focus(); }, 30);
  }

  // On boot: if the welcome flow has never completed, show the required first-launch
  // chooser. Never blocks anything else — a kv failure just means it stays hidden and
  // MA.economy's own defaults (character null -> x1) keep earning working.
  ready.then(function () { return MA.store.getKV("firstRunDone", false); })
    .then(function (done) { if (!done) openChooser({ firstRun: true }); })
    .catch(function () {});

  MA.characters = { getCharacter: getCharacter, select: select, list: list, ready: ready, openChooser: openChooser };
})();

</script>

<script>
/* ---- js/modules/daily.js ---- */
/* daily.js — consecutive-day login streak: computes the streak from lastClaimDate vs
   today's local date, shows a "Day X of 7" popup with a Claim button, and awards the
   bonus via the unmultiplied MA.economy.grant() (this flow already applies its own
   ladder/Expert math, so it must never go through earnCoins, which would multiply it
   again). Dispatches ma:login so economy's cached streak/effectiveMultiplier() stays
   correct. Reads MA.characters.getCharacter() for the Expert bonus/freeze if the
   module is present; otherwise treats it as no bonus. */
(function () {
  "use strict";
  var MA = window.MA, U = MA.util, el = U.el;

  // local (not UTC) calendar date as YYYY-MM-DD, matching economy.js's todayLocal().
  function todayLocal() {
    var d = new Date();
    return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  }
  // whole-day difference (b - a) between two YYYY-MM-DD strings, treated as UTC
  // midnights so DST transitions never shift the count.
  function daysBetween(a, b) {
    return Math.round((new Date(b + "T00:00:00Z").getTime() - new Date(a + "T00:00:00Z").getTime()) / 86400000);
  }
  function getCharacter() {
    return (MA.characters && MA.characters.getCharacter) ? MA.characters.getCharacter() : null;
  }

  // in-memory cache of kv `login`, hydrated once below. computeStreakInfo() and claim()
  // both read/mutate this directly (never re-read kv mid-flow) — see the claim() guard.
  var login = null;
  var ready = MA.store.getKV("login", null).then(function (v) { login = v || null; })
    .catch(function () { login = null; });

  // Pure projection of {in-memory login, today, character} -> what the popup/widget
  // should show. Never mutates `login` or kv — only claim() does that.
  function computeStreakInfo() {
    var today = todayLocal();
    var character = getCharacter();
    var streak, claimedToday, freezeUsed = false, freezeWeek = login ? (login.freezeWeek || null) : null;

    if (!login) {
      streak = 1; claimedToday = false;
    } else if (login.lastClaimDate === today) {
      streak = login.streak || 1; claimedToday = true;
    } else {
      claimedToday = false;
      var diff = daysBetween(login.lastClaimDate, today);
      var thisWeek = U.weekKey(new Date());
      if (diff === 1) {
        streak = (login.streak || 0) + 1;
      } else if (diff === 2 && character === "expert" && login.freezeWeek !== thisWeek) {
        // Expert freeze: exactly one missed day, freeze not yet used this ISO week.
        streak = (login.streak || 0) + 1;
        freezeUsed = true;
        freezeWeek = thisWeek;
      } else {
        streak = 1; // gap > 1 missed day, or freeze already used this week, or clock skew
      }
    }

    var cyclePos = ((streak - 1) % 7) + 1;
    var mult = MA.economy.streakMult(streak);
    var bonus = Math.round(25 * mult * (character === "expert" ? 1.5 : 1)) + (streak % 7 === 0 ? 300 : 0);
    return {
      streak: streak, claimedToday: claimedToday, bonus: bonus, cyclePos: cyclePos,
      multiplier: mult, freezeUsed: freezeUsed, freezeWeek: freezeWeek
    };
  }

  function getStreakInfo() { return computeStreakInfo(); }

  /* ---------- claim (pay-exactly-once-per-day) ---------- */
  // See _shared-context.md cross-task notes / MA.characters.select for why this shape:
  // the claimed-today check-and-set on the in-memory `login` happens synchronously,
  // with no await/.then between the read and the write, so two overlapping claim()
  // calls (double-click, or two triggers before the first settles) can't both win.
  function claim() {
    return ready.then(function () {
      var today = todayLocal();
      if (login && login.lastClaimDate === today) {
        return { claimed: false, alreadyClaimed: true, streak: login.streak || 1 };
      }
      var info = computeStreakInfo();
      var newLogin = { streak: info.streak, lastClaimDate: today, freezeWeek: info.freezeWeek || null };
      var prevLogin = login;
      login = newLogin; // <-- synchronous claim of today's slot, before any await below
      var credited = false;
      var bonus = info.bonus, streak = info.streak;

      return MA.economy.ready.then(function () {
        MA.economy.grant(bonus);
        credited = true;
        return MA.store.setKV("login", newLogin);
      }).then(function () {
        window.dispatchEvent(new CustomEvent("ma:login", { detail: { streak: streak, multiplier: MA.economy.streakMult(streak) } }));
        if (MA.celebrate) MA.celebrate({ count: 90, y: (window.innerHeight || 800) * 0.35 });
        return { claimed: true, streak: streak, bonus: bonus };
      }).catch(function (err) {
        // Only undo the in-memory claim if no credit actually landed — rolling back
        // after a real grant() would let a retry double-pay.
        if (!credited) login = prevLogin;
        throw err;
      });
    });
  }

  /* ---------- login popup ---------- */
  var popupOpen = false;
  function openPopup(info) {
    if (popupOpen) return;
    popupOpen = true;
    var lastFocused = document.activeElement;
    var titleId = "dailyModalTitle" + Date.now();

    var overlay = el("div", { class: "daily-modal", role: "dialog", "aria-modal": "true", "aria-labelledby": titleId });
    var card = el("div", { class: "daily-modal__card" });
    overlay.appendChild(card);

    function focusables() {
      return Array.prototype.slice.call(overlay.querySelectorAll("button, [href], input, select, textarea, [tabindex]:not([tabindex='-1'])"))
        .filter(function (n) { return !n.disabled && n.offsetParent !== null; });
    }
    function close() {
      if (!overlay.parentNode) return;
      document.removeEventListener("keydown", onKeydown);
      overlay.parentNode.removeChild(overlay);
      popupOpen = false;
      if (lastFocused && lastFocused.focus) { try { lastFocused.focus(); } catch (e) {} }
    }
    // Escape / tap-outside DISMISSES only — no kv write, popup reappears next open.
    function onKeydown(e) { if (e.key === "Escape") { close(); return; } tabTrap(e); }
    function tabTrap(e) {
      if (e.key !== "Tab") return;
      var f = focusables();
      if (!f.length) return;
      var first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
    overlay.addEventListener("click", function (e) { if (e.target === overlay) close(); });

    card.appendChild(el("div", { class: "daily-modal__emoji", "aria-hidden": "true", text: "🔥" }));
    card.appendChild(el("h3", { id: titleId, class: "daily-modal__title", text: "Day " + info.cyclePos + " of 7" }));
    card.appendChild(el("div", { class: "daily-modal__bar" }, [
      el("div", { class: "daily-modal__bar-fill", style: "width:" + Math.round((info.cyclePos / 7) * 100) + "%" })
    ]));
    card.appendChild(el("div", { class: "daily-modal__mult", text: info.multiplier.toFixed(1) + "× multiplier" }));
    card.appendChild(el("div", { class: "daily-modal__bonus", text: "+" + info.bonus + " 🪙" }));

    var claimBtn = el("button", { class: "btn btn--accent btn--block", type: "button", "aria-label": "Claim daily login bonus" }, "Claim");
    claimBtn.addEventListener("click", function () {
      if (claimBtn.disabled) return;
      claimBtn.disabled = true;
      claim().then(function (result) {
        if (result && result.claimed) {
          close();
        } else {
          // already claimed elsewhere (e.g. two popups) — just close, no error state to show
          close();
        }
      }).catch(function () {
        claimBtn.disabled = false;
        if (MA.app && MA.app.toast) MA.app.toast("Couldn't claim right now — try again");
      });
    });
    card.appendChild(claimBtn);

    document.addEventListener("keydown", onKeydown);
    document.body.appendChild(overlay);
    setTimeout(function () { var f = focusables(); if (f.length) f[0].focus(); }, 30);
  }

  function showPopupIfDue() {
    return ready.then(function () {
      if (popupOpen) return;
      var info = computeStreakInfo();
      if (info.claimedToday) return;
      openPopup(info);
    });
  }

  /* ---------- Home streak widget (Task 7 mounts this) ---------- */
  function renderWidget() {
    var node = el("div", { class: "daily-widget", "aria-label": "Daily login streak" }, [
      el("span", { "aria-hidden": "true", text: "🔥" }),
      el("span", { class: "daily-widget__text", text: "Day 1 / 7" }),
      el("span", { class: "daily-widget__mult", text: "1.0×" })
    ]);
    ready.then(function () {
      var info = computeStreakInfo();
      node.querySelector(".daily-widget__text").textContent = "Day " + info.cyclePos + " / 7";
      node.querySelector(".daily-widget__mult").textContent = info.multiplier.toFixed(1) + "×";
    });
    return node;
  }

  // On boot, show the popup once today's bonus is unclaimed. If the first-launch
  // character chooser is about to open (firstRunDone not yet set), wait for it to
  // resolve (the ma:character event it fires on select) so the two modals never stack.
  // Also gate on MA.characters.ready (guarded for the module being absent) —
  // computeStreakInfo() reads getCharacter() for the Expert bonus/freeze, and
  // independent getKV calls across modules aren't guaranteed to resolve in issue
  // order, so skipping this wait can compute/display against a not-yet-hydrated
  // (null) character on a returning user's first paint.
  Promise.all([ready, MA.economy.ready, MA.characters ? MA.characters.ready : Promise.resolve()]).then(function () {
    return MA.store.getKV("firstRunDone", false);
  }).then(function (firstRunDone) {
    if (!firstRunDone && MA.characters) {
      window.addEventListener("ma:character", function once() {
        window.removeEventListener("ma:character", once);
        showPopupIfDue();
      });
    } else {
      showPopupIfDue();
    }
  }).catch(function () {});

  MA.daily = { getStreakInfo: getStreakInfo, claim: claim, showPopupIfDue: showPopupIfDue, renderWidget: renderWidget, ready: ready };
})();

</script>

<script>
/* ---- js/modules/shop.js ---- */
/* shop.js — 56-item catalog (5 tiers), category-chip + 2-col grid render, detail
   sheet (with a 5-scene gallery for the mansion), and the purchase flow with the
   Diva 15% checkout discount and `owned` persistence. Reads MA.economy for
   wallet/spend and MA.characters for the active character; writes to the `owned`
   store (added in Task 1) via MA.store. Does not wire the bottom nav tab — that is
   Task 7's job; this task exposes the view via the More menu + a "#/shop" route
   (see app.js) so it is reachable for verification. */
(function () {
  "use strict";
  var MA = window.MA, U = MA.util, el = U.el;

  /* ---------- catalog (56 items, tiers 1-5; price = usd = coins) ---------- */
  var CATALOG = [
